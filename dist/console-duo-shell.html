<title>Console Duo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E3E6DB;
    --surface:#EEF0E6;
    --surface-2:#DBDFCF;
    --surface-3:#CDD2BE;
    --ink:#1C1E16;
    --ink-muted:#585C4C;
    --ink-faint:#7B8069;
    --border:#C4C9B6;
    --border-strong:#AEB49B;
    --accent:#B04F1B;
    --accent-ink:#FFF6EC;
    --accent-soft:#E7D9C4;
    --accent-soft-ink:#5C3311;
    --olive:#4E5C34;
    --teal:#2E6363;
    --teal-soft:#D7E6E3;
    --warn:#8A6112;
    --critical:#9C3327;
    --critical-soft:#F1DAD5;
    --critical-ink:#6E1F16;
    --shadow: 0 1px 2px rgba(28,30,22,.06), 0 8px 24px -12px rgba(28,30,22,.18);
    --radius: 10px;
    --font-display: "Big Shoulders Display", "Arial Narrow", sans-serif;
    --font-body: "Work Sans", ui-sans-serif, system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15160F;
      --surface:#1C1E15;
      --surface-2:#262819;
      --surface-3:#33361F;
      --ink:#EEEADA;
      --ink-muted:#A6A88F;
      --ink-faint:#7D8068;
      --border:#3A3C29;
      --border-strong:#4C4F35;
      --accent:#E17E3F;
      --accent-ink:#221000;
      --accent-soft:#3C2A17;
      --accent-soft-ink:#F3D3AE;
      --olive:#93A86E;
      --teal:#7CBFBB;
      --teal-soft:#1E3230;
      --warn:#D9AA45;
      --critical:#E2685C;
      --critical-soft:#3B1E19;
      --critical-ink:#F4C9C1;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#15160F;
    --surface:#1C1E15;
    --surface-2:#262819;
    --surface-3:#33361F;
    --ink:#EEEADA;
    --ink-muted:#A6A88F;
    --ink-faint:#7D8068;
    --border:#3A3C29;
    --border-strong:#4C4F35;
    --accent:#E17E3F;
    --accent-ink:#221000;
    --accent-soft:#3C2A17;
    --accent-soft-ink:#F3D3AE;
    --olive:#93A86E;
    --teal:#7CBFBB;
    --teal-soft:#1E3230;
    --warn:#D9AA45;
    --critical:#E2685C;
    --critical-soft:#3B1E19;
    --critical-ink:#F4C9C1;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }

  *{ box-sizing:border-box; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; } }

  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent); color:var(--accent-ink); }
  a{ color:inherit; }
  button, input, select, textarea{ font-family:inherit; color:inherit; }
  input:focus-visible, select:focus-visible, button:focus-visible, [tabindex]:focus-visible{
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .app{ display:flex; flex-direction:column; height:100vh; min-height:600px; }

  /* ---------- HEADER ---------- */
  .topbar{
    flex:none;
    display:flex; flex-wrap:wrap; align-items:center; gap:14px;
    padding:14px 20px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
  }
  .brand{ display:flex; align-items:baseline; gap:10px; margin-right:auto; }
  .brand h1{
    font-family:var(--font-display); font-weight:800; font-size:26px; letter-spacing:.01em;
    margin:0; text-transform:uppercase; text-wrap:balance;
  }
  .brand .tag{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-faint); border:1px solid var(--border-strong); border-radius:999px;
    padding:2px 8px;
  }
  .tabs{ display:flex; gap:6px; background:var(--surface-2); padding:4px; border-radius:999px; border:1px solid var(--border); }
  .tab-btn{
    appearance:none; border:none; background:transparent; color:var(--ink-muted);
    font-family:var(--font-body); font-weight:600; font-size:13px;
    padding:8px 16px; border-radius:999px; cursor:pointer; white-space:nowrap;
  }
  .tab-btn[aria-selected="true"]{ background:var(--accent); color:var(--accent-ink); }
  .search-wrap{ position:relative; }
  .search-wrap input{
    width:230px; background:var(--surface-2); border:1px solid var(--border); color:var(--ink);
    border-radius:8px; padding:8px 12px 8px 30px; font-size:13px;
  }
  .search-wrap svg{ position:absolute; left:9px; top:50%; transform:translateY(-50%); opacity:.55; pointer-events:none; }
  .header-actions{ display:flex; align-items:center; gap:10px; }
  .changes-pill{
    font-family:var(--font-mono); font-size:12px; color:var(--teal); background:var(--teal-soft);
    border-radius:999px; padding:5px 11px; white-space:nowrap;
  }
  .btn{
    appearance:none; cursor:pointer; border-radius:8px; font-weight:600; font-size:13px;
    padding:8px 14px; border:1px solid var(--border-strong); background:var(--surface-2); color:var(--ink);
  }
  .btn:hover{ background:var(--surface-3); }
  .btn.danger-outline{ border-color: var(--critical); color:var(--critical); background:transparent; }
  .btn.danger-outline:hover{ background: var(--critical-soft); }

  /* ---------- LAYOUT ---------- */
  .layout{ flex:1; display:grid; grid-template-columns: 216px 1fr 380px; min-height:0; }
  @media (max-width: 1180px){ .layout{ grid-template-columns: 190px 1fr 340px; } }
  @media (max-width: 960px){
    .layout{ grid-template-columns: 1fr; }
    .nav{ display:none; }
  }

  .nav{
    border-right:1px solid var(--border); background:var(--surface); overflow-y:auto; padding:16px 10px;
  }
  .nav-title{ font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); padding:4px 10px 8px; }
  .nav-item{
    display:block; width:100%; text-align:left; background:none; border:none; cursor:pointer;
    color:var(--ink-muted); font-size:12.5px; padding:7px 10px; border-radius:7px; line-height:1.3;
  }
  .nav-item:hover{ background:var(--surface-2); color:var(--ink); }
  .nav-item.current{ background:var(--accent-soft); color:var(--accent-soft-ink); font-weight:600; }

  .content{ overflow-y:auto; padding:22px 26px 60px; }
  @media (max-width: 960px){ .content{ padding:18px 16px 40px; } }

  .content-intro{
    max-width:62ch; color:var(--ink-muted); font-size:13.5px; margin: 0 0 22px;
  }

  .section{ margin-bottom:34px; scroll-margin-top:16px; }
  .section h2{
    font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:.01em;
    text-transform:uppercase; margin:0 0 4px; padding-bottom:8px; border-bottom:2px solid var(--border-strong);
    text-wrap:balance;
  }
  .section-count{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); margin:0 0 14px; }

  .fields-grid{ display:flex; flex-direction:column; gap:2px; }
  .field{
    display:grid; grid-template-columns: minmax(0,1.15fr) minmax(0,1fr); gap:6px 24px;
    padding:13px 12px; border-radius:8px; border:1px solid transparent;
  }
  .field:hover{ background:var(--surface); }
  .field.modified{ border-color:var(--teal); background:var(--teal-soft); }
  @media (max-width: 720px){ .field{ grid-template-columns: 1fr; } }

  .field-info{ min-width:0; }
  .field-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .field-label{ font-weight:600; font-size:13.5px; }
  .mod-badge{
    font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.04em;
    background:var(--teal); color:var(--surface); border-radius:999px; padding:2px 7px;
  }
  .field-reset{
    background:none; border:none; cursor:pointer; color:var(--teal); font-size:11px; font-weight:600;
    padding:2px 4px; border-radius:5px; font-family:var(--font-mono);
  }
  .field-reset:hover{ text-decoration:underline; }
  .field-key{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); }
  .field-desc{ margin:4px 0 0; font-size:12.5px; color:var(--ink-muted); max-width:52ch; }

  .field-control{ display:flex; flex-direction:column; gap:6px; justify-content:center; min-width:0; }

  /* toggle switch */
  .switch-row{ display:flex; align-items:center; gap:10px; }
  .switch{ position:relative; display:inline-block; width:42px; height:24px; flex:none; }
  .switch input{ opacity:0; width:0; height:0; }
  .switch-track{
    position:absolute; inset:0; background:var(--surface-3); border:1px solid var(--border-strong);
    border-radius:999px; transition:background .15s ease;
  }
  .switch-track::before{
    content:""; position:absolute; width:16px; height:16px; left:3px; top:2px; background:var(--surface);
    border-radius:50%; transition:transform .15s ease; box-shadow:var(--shadow);
  }
  .switch input:checked + .switch-track{ background:var(--accent); border-color:var(--accent); }
  .switch input:checked + .switch-track::before{ transform:translateX(18px); background:var(--accent-ink); }
  .switch-state{ font-size:12.5px; font-weight:600; color:var(--ink-muted); font-family:var(--font-mono); }

  select.ctrl{
    background:var(--surface-2); border:1px solid var(--border-strong); color:var(--ink);
    border-radius:7px; padding:8px 10px; font-size:13px; width:100%; max-width:280px;
  }

  .range-row{ display:flex; align-items:center; gap:10px; }
  input[type="range"]{ flex:1; accent-color:var(--accent); min-width:80px; }
  input.num{
    width:88px; background:var(--surface-2); border:1px solid var(--border-strong); color:var(--ink);
    border-radius:7px; padding:7px 8px; font-family:var(--font-mono); font-size:13px; font-variant-numeric:tabular-nums;
  }
  .range-hint{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); }

  input.text-ctrl{
    width:100%; max-width:320px; background:var(--surface-2); border:1px solid var(--border-strong); color:var(--ink);
    border-radius:7px; padding:8px 10px; font-size:13px; font-family:var(--font-mono);
  }
  .pw-row{ display:flex; align-items:center; gap:6px; }
  .pw-toggle{
    background:var(--surface-2); border:1px solid var(--border-strong); border-radius:7px; cursor:pointer;
    font-size:11px; padding:8px 9px; color:var(--ink-muted); font-family:var(--font-mono);
  }
  .sensitive-note{
    display:flex; gap:8px; align-items:flex-start; background:var(--critical-soft); color:var(--critical-ink);
    border-radius:7px; padding:8px 10px; font-size:12px; margin-top:2px; max-width:320px;
  }
  .sensitive-note svg{ flex:none; margin-top:1px; }

  .no-results{ color:var(--ink-faint); font-size:13px; padding:30px 10px; text-align:center; }

  /* ---------- OUTPUT PANEL ---------- */
  .output{
    border-left:1px solid var(--border); background:var(--surface); display:flex; flex-direction:column; min-height:0;
  }
  @media (max-width: 960px){
    .output{ border-left:none; border-top:1px solid var(--border); max-height:46vh; }
  }
  .output-head{ padding:14px 16px 10px; border-bottom:1px solid var(--border); flex:none; }
  .output-head h3{ font-family:var(--font-display); font-weight:700; font-size:15px; text-transform:uppercase; margin:0 0 2px; }
  .output-head p{ margin:0; font-size:11.5px; color:var(--ink-faint); }
  .output-actions{ display:flex; gap:8px; padding:10px 16px; flex:none; }
  .output-actions .btn{ flex:1; }
  .output-actions .btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .output-actions .btn.primary:hover{ filter:brightness(1.08); }
  .copy-feedback{ font-size:11.5px; color:var(--teal); padding:0 16px 8px; min-height:16px; font-family:var(--font-mono); }
  .output-code-wrap{ flex:1; overflow:auto; padding:0 16px 16px; min-height:0; }
  textarea.output-code{
    width:100%; height:100%; min-height:260px; resize:none; background:var(--surface-2);
    border:1px solid var(--border-strong); border-radius:8px; color:var(--ink);
    font-family:var(--font-mono); font-size:11.5px; line-height:1.55; padding:12px;
    white-space:pre; overflow:auto;
  }

  [hidden]{ display:none !important; }
</style>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <h1>Console Duo</h1>
      <span class="tag">editor de config</span>
    </div>
    <div class="tabs" role="tablist" aria-label="Arquivo de configuração">
      <button class="tab-btn" data-tab="ini" role="tab" aria-selected="true">Servidor · server.ini</button>
      <button class="tab-btn" data-tab="lua" role="tab" aria-selected="false">Mundo &amp; Zumbis · SandboxVars.lua</button>
    </div>
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="search" placeholder="Buscar uma configuração…" autocomplete="off">
    </div>
    <div class="header-actions">
      <span class="changes-pill" id="changes-pill" hidden></span>
      <button class="btn danger-outline" id="reset-btn" hidden>Desfazer alterações</button>
    </div>
  </header>

  <div class="layout">
    <nav class="nav" id="nav" aria-label="Categorias"></nav>
    <main class="content" id="content"></main>
    <aside class="output" aria-label="Arquivo gerado">
      <div class="output-head">
        <h3 id="output-title">Duo.ini gerado</h3>
        <p id="output-sub">Atualiza sozinho a cada mudança à esquerda.</p>
      </div>
      <div class="output-actions">
        <button class="btn primary" id="copy-btn">Copiar arquivo</button>
      </div>
      <p class="copy-feedback" id="copy-feedback"></p>
      <div class="output-code-wrap">
        <textarea class="output-code" id="output-code" spellcheck="false" readonly></textarea>
      </div>
    </aside>
  </div>
</div>

<script>
const BUNDLE = /*__BUNDLE_JSON__*/;
const UNBOUND = 2147483647;

const state = { ini:{}, lua:{} };
const original = { ini:{}, lua:{} };
BUNDLE.iniFields.forEach(f => { state.ini[f.id] = f.value; original.ini[f.id] = f.value; });
BUNDLE.luaFields.forEach(f => { state.lua[f.id] = f.value; original.lua[f.id] = f.value; });

const fieldById = {};
BUNDLE.iniFields.forEach(f => fieldById[f.id] = f);
BUNDLE.luaFields.forEach(f => fieldById[f.id] = f);

let activeTab = 'ini';

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function normalize(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function useSlider(f){
  return (f.max - f.min) <= 2000 && f.max < UNBOUND;
}
function decimalsStep(dec){
  return dec > 0 ? (1 / Math.pow(10, dec)).toFixed(dec) : '1';
}
function fmtNum(v, dec){
  const n = Number(v);
  return isNaN(n) ? v : n.toFixed(dec);
}

function fieldsBySection(kind){
  const sections = kind === 'ini' ? BUNDLE.iniSections : BUNDLE.luaSections;
  const fields = kind === 'ini' ? BUNDLE.iniFields : BUNDLE.luaFields;
  const map = new Map(sections.map(s => [s, []]));
  fields.forEach(f => { if(!map.has(f.section)) map.set(f.section, []); map.get(f.section).push(f); });
  return sections.map(s => ({ section: s, fields: map.get(s) || [] }));
}

function controlHTML(kind, f){
  const val = state[kind][f.id];
  if(f.type === 'toggle'){
    const checked = val === 'true';
    return `<div class="switch-row">
      <label class="switch">
        <input type="checkbox" data-id="${f.id}" data-kind="${kind}" class="ctl-toggle" ${checked?'checked':''}>
        <span class="switch-track"></span>
      </label>
      <span class="switch-state" data-state-for="${f.id}">${checked?'Ativado':'Desativado'}</span>
    </div>`;
  }
  if(f.type === 'select'){
    const opts = f.options.map(o => `<option value="${esc(o.v)}" ${o.v===val?'selected':''}>${esc(o.l)}</option>`).join('');
    return `<select class="ctrl ctl-select" data-id="${f.id}" data-kind="${kind}">${opts}</select>`;
  }
  if(f.type === 'range'){
    const dec = f.decimals || 0;
    const step = decimalsStep(dec);
    const maxLabel = f.max >= UNBOUND ? 'sem limite prático' : fmtNum(f.max, dec);
    if(useSlider(f)){
      return `<div class="range-row">
        <input type="range" class="ctl-range" data-id="${f.id}" data-kind="${kind}" min="${f.min}" max="${f.max}" step="${step}" value="${val}">
        <input type="number" class="num ctl-range-num" data-id="${f.id}" data-kind="${kind}" min="${f.min}" max="${f.max}" step="${step}" value="${val}">
      </div>
      <div class="range-hint">mín. ${fmtNum(f.min,dec)} · máx. ${maxLabel}</div>`;
    }
    return `<div class="range-row">
      <input type="number" class="num ctl-range-num" data-id="${f.id}" data-kind="${kind}" min="${f.min}" max="${f.max}" step="${step}" value="${val}" style="width:140px">
    </div>
    <div class="range-hint">mín. ${fmtNum(f.min,dec)} · máx. ${maxLabel}</div>`;
  }
  if(f.type === 'password'){
    return `<div class="pw-row">
        <input type="password" class="text-ctrl ctl-text" data-id="${f.id}" data-kind="${kind}" value="${esc(val)}" placeholder="deixe em branco para manter a atual" autocomplete="off">
        <button type="button" class="pw-toggle" data-pw-toggle="${f.id}">mostrar</button>
      </div>
      <div class="sensitive-note">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
        <span>Por segurança, o valor atual não fica pré-carregado. Nada digitado aqui sai do seu navegador.</span>
      </div>`;
  }
  return `<input type="text" class="text-ctrl ctl-text" data-id="${f.id}" data-kind="${kind}" value="${esc(val)}">`;
}

function fieldHTML(kind, f){
  const searchBlob = esc(normalize(f.label + ' ' + f.desc + ' ' + f.id));
  return `<div class="field" data-field-id="${f.id}" data-search="${searchBlob}">
    <div class="field-info">
      <div class="field-head">
        <span class="field-label">${esc(f.label)}</span>
        <span class="mod-badge" data-badge-for="${f.id}" hidden>alterado</span>
        <button type="button" class="field-reset" data-reset-for="${f.id}" hidden>restaurar</button>
      </div>
      <p class="field-desc">${esc(f.desc)}</p>
    </div>
    <div class="field-control" data-control-for="${f.id}">${controlHTML(kind, f)}</div>
  </div>`;
}

function sectionId(kind, name){
  return 'sec-' + kind + '-' + normalize(name).replace(/[^a-z0-9]+/g,'-');
}

function renderTab(kind){
  const groups = fieldsBySection(kind);
  const intro = kind === 'ini'
    ? '<p class="content-intro">Configurações de comportamento do servidor: acesso, chat, PVP, safehouses, rede, backups. Mudanças aqui só valem depois de reiniciar o servidor.</p>'
    : '<p class="content-intro">Configurações do mundo e da sobrevivência: zumbis, loot, clima, XP e tudo que vem do SandboxVars. Também só valem depois de reiniciar o servidor.</p>';
  const html = groups.map(g => {
    if(g.fields.length === 0) return '';
    return `<section class="section" id="${sectionId(kind, g.section)}" data-section-name="${esc(normalize(g.section))}">
      <h2>${esc(g.section)}</h2>
      <p class="section-count">${g.fields.length} configuraç${g.fields.length===1?'ão':'ões'}</p>
      <div class="fields-grid">${g.fields.map(f => fieldHTML(kind, f)).join('')}</div>
    </section>`;
  }).join('');
  return intro + html + '<p class="no-results" id="no-results-' + kind + '" hidden>Nenhuma configuração encontrada para essa busca.</p>';
}

function renderNav(kind){
  const groups = fieldsBySection(kind).filter(g => g.fields.length);
  return `<div class="nav-title">Categorias</div>` + groups.map(g =>
    `<button class="nav-item" data-nav-target="${sectionId(kind, g.section)}">${esc(g.section)}</button>`
  ).join('');
}

const contentEl = document.getElementById('content');
const navEl = document.getElementById('nav');
const contentCache = {};
const navCache = {};

function mountTab(kind){
  if(!contentCache[kind]) contentCache[kind] = renderTab(kind);
  if(!navCache[kind]) navCache[kind] = renderNav(kind);
  contentEl.innerHTML = contentCache[kind];
  navEl.innerHTML = navCache[kind];
  attachNavListeners();
  refreshAllModifiedUI(kind);
  updateChangesPill();
  regenerateOutput();
  applySearch();
}

function attachNavListeners(){
  navEl.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = document.getElementById(btn.dataset.navTarget);
      if(target) target.scrollIntoView({ behavior:'smooth', block:'start' });
    });
  });
}

function setState(kind, id, value){
  state[kind][id] = value;
  updateFieldModifiedUI(kind, id);
  updateChangesPill();
  regenerateOutput();
}

function updateFieldModifiedUI(kind, id){
  const modified = state[kind][id] !== original[kind][id];
  const row = contentEl.querySelector(`.field[data-field-id="${cssEscape(id)}"]`);
  const badge = contentEl.querySelector(`[data-badge-for="${cssEscape(id)}"]`);
  const resetBtn = contentEl.querySelector(`[data-reset-for="${cssEscape(id)}"]`);
  if(row) row.classList.toggle('modified', modified);
  if(badge) badge.hidden = !modified;
  if(resetBtn) resetBtn.hidden = !modified;
}

function cssEscape(s){
  return String(s).replace(/[."\[\]]/g, '\\$&');
}

function refreshAllModifiedUI(kind){
  Object.keys(state[kind]).forEach(id => updateFieldModifiedUI(kind, id));
}

function updateChangesPill(){
  const count = Object.keys(state[activeTab]).filter(id => state[activeTab][id] !== original[activeTab][id]).length;
  const pill = document.getElementById('changes-pill');
  const resetBtn = document.getElementById('reset-btn');
  if(count > 0){
    pill.hidden = false;
    pill.textContent = count + (count===1 ? ' alteração pendente' : ' alterações pendentes');
    resetBtn.hidden = false;
  } else {
    pill.hidden = true;
    resetBtn.hidden = true;
  }
}

// Event delegation: attached once to the container, survives every re-render
// (mountTab / resetSingleField replace innerHTML, so per-element listeners
// would otherwise pile up as duplicates every time a field is reset).
function initDelegatedListeners(){
  contentEl.addEventListener('change', e => {
    const el = e.target;
    if(el.classList.contains('ctl-toggle')){
      const v = el.checked ? 'true' : 'false';
      const stateEl = contentEl.querySelector(`[data-state-for="${cssEscape(el.dataset.id)}"]`);
      if(stateEl) stateEl.textContent = el.checked ? 'Ativado' : 'Desativado';
      setState(el.dataset.kind, el.dataset.id, v);
    } else if(el.classList.contains('ctl-select')){
      setState(el.dataset.kind, el.dataset.id, el.value);
    }
  });
  contentEl.addEventListener('input', e => {
    const el = e.target;
    if(el.classList.contains('ctl-range')){
      const numEl = contentEl.querySelector(`.ctl-range-num[data-id="${cssEscape(el.dataset.id)}"]`);
      if(numEl) numEl.value = el.value;
      setState(el.dataset.kind, el.dataset.id, el.value);
    } else if(el.classList.contains('ctl-range-num')){
      const rangeEl = contentEl.querySelector(`.ctl-range[data-id="${cssEscape(el.dataset.id)}"]`);
      if(rangeEl) rangeEl.value = el.value;
      setState(el.dataset.kind, el.dataset.id, el.value);
    } else if(el.classList.contains('ctl-text')){
      setState(el.dataset.kind, el.dataset.id, el.value);
    }
  });
  contentEl.addEventListener('click', e => {
    const pwBtn = e.target.closest('[data-pw-toggle]');
    if(pwBtn){
      const id = pwBtn.dataset.pwToggle;
      const input = contentEl.querySelector(`input.ctl-text[data-id="${cssEscape(id)}"]`);
      if(input){
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        pwBtn.textContent = show ? 'ocultar' : 'mostrar';
      }
      return;
    }
    const resetBtn = e.target.closest('[data-reset-for]');
    if(resetBtn){
      resetSingleField(activeTab, resetBtn.dataset.resetFor);
    }
  });
}

function resetSingleField(kind, id){
  const f = fieldById[id];
  state[kind][id] = original[kind][id];
  const row = contentEl.querySelector(`.field[data-field-id="${cssEscape(id)}"]`);
  if(row){
    const controlWrap = row.querySelector('.field-control');
    controlWrap.innerHTML = controlHTML(kind, f);
  }
  updateFieldModifiedUI(kind, id);
  updateChangesPill();
  regenerateOutput();
}

function resetAll(){
  Object.keys(state[activeTab]).forEach(id => { state[activeTab][id] = original[activeTab][id]; });
  contentCache[activeTab] = null;
  mountTab(activeTab);
}

function generateOutput(kind){
  let text = kind === 'ini' ? BUNDLE.iniTemplate : BUNDLE.luaTemplate;
  const fields = kind === 'ini' ? BUNDLE.iniFields : BUNDLE.luaFields;
  fields.forEach(f => {
    let v = state[kind][f.id];
    if(f.sensitive && String(v).trim() === ''){
      v = '<<DEFINA_A_SENHA_AQUI>>';
    } else if(f.type === 'range'){
      v = fmtNum(v, f.decimals || 0);
    } else if(f.type === 'text' && kind === 'lua'){
      v = String(v).replace(/\\/g,'\\\\').replace(/"/g,'\\"');
    } else if(f.type === 'text' && kind === 'ini'){
      v = String(v).replace(/[\r\n]+/g, ' ');
    }
    text = text.split(f.ph).join(v);
  });
  return text;
}

function regenerateOutput(){
  const code = document.getElementById('output-code');
  code.value = generateOutput(activeTab);
  document.getElementById('output-title').textContent = (activeTab === 'ini' ? 'Duo.ini' : 'Duo_SandboxVars.lua') + ' gerado';
}

function applySearch(){
  const q = normalize(document.getElementById('search').value.trim());
  const sections = contentEl.querySelectorAll('.section');
  let anyVisible = false;
  sections.forEach(sec => {
    const rows = sec.querySelectorAll('.field');
    let visibleInSection = 0;
    rows.forEach(row => {
      const match = q === '' || row.dataset.search.includes(q);
      row.hidden = !match;
      if(match) visibleInSection++;
    });
    sec.hidden = visibleInSection === 0;
    if(visibleInSection > 0) anyVisible = true;
  });
  const noResults = document.getElementById('no-results-' + activeTab);
  if(noResults) noResults.hidden = anyVisible || q === '';
}

document.getElementById('search').addEventListener('input', applySearch);

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeTab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.setAttribute('aria-selected', b === btn ? 'true' : 'false'));
    document.getElementById('search').value = '';
    mountTab(activeTab);
    contentEl.scrollTop = 0;
  });
});

document.getElementById('reset-btn').addEventListener('click', resetAll);

document.getElementById('copy-btn').addEventListener('click', async () => {
  const text = generateOutput(activeTab);
  const feedback = document.getElementById('copy-feedback');
  try{
    await navigator.clipboard.writeText(text);
    feedback.textContent = 'Copiado! Já pode colar no servidor.';
  }catch(e){
    const ta = document.getElementById('output-code');
    ta.focus();
    ta.select();
    feedback.textContent = 'Não deu pra copiar automaticamente — texto selecionado, use Ctrl+C.';
  }
  setTimeout(() => { feedback.textContent = ''; }, 4000);
});

initDelegatedListeners();
mountTab('ini');
</script>
