<title>Console Duo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#E3E6DB;
    --surface:#EEF0E6;
    --surface-2:#DBDFCF;
    --surface-3:#CDD2BE;
    --ink:#1C1E16;
    --ink-muted:#585C4C;
    --ink-faint:#7B8069;
    --border:#C4C9B6;
    --border-strong:#AEB49B;
    --accent:#B04F1B;
    --accent-ink:#FFF6EC;
    --accent-soft:#E7D9C4;
    --accent-soft-ink:#5C3311;
    --olive:#4E5C34;
    --teal:#2E6363;
    --teal-soft:#D7E6E3;
    --warn:#8A6112;
    --critical:#9C3327;
    --critical-soft:#F1DAD5;
    --critical-ink:#6E1F16;
    --shadow: 0 1px 2px rgba(28,30,22,.06), 0 8px 24px -12px rgba(28,30,22,.18);
    --radius: 10px;
    --font-display: "Big Shoulders Display", "Arial Narrow", sans-serif;
    --font-body: "Work Sans", ui-sans-serif, system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15160F;
      --surface:#1C1E15;
      --surface-2:#262819;
      --surface-3:#33361F;
      --ink:#EEEADA;
      --ink-muted:#A6A88F;
      --ink-faint:#7D8068;
      --border:#3A3C29;
      --border-strong:#4C4F35;
      --accent:#E17E3F;
      --accent-ink:#221000;
      --accent-soft:#3C2A17;
      --accent-soft-ink:#F3D3AE;
      --olive:#93A86E;
      --teal:#7CBFBB;
      --teal-soft:#1E3230;
      --warn:#D9AA45;
      --critical:#E2685C;
      --critical-soft:#3B1E19;
      --critical-ink:#F4C9C1;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#15160F;
    --surface:#1C1E15;
    --surface-2:#262819;
    --surface-3:#33361F;
    --ink:#EEEADA;
    --ink-muted:#A6A88F;
    --ink-faint:#7D8068;
    --border:#3A3C29;
    --border-strong:#4C4F35;
    --accent:#E17E3F;
    --accent-ink:#221000;
    --accent-soft:#3C2A17;
    --accent-soft-ink:#F3D3AE;
    --olive:#93A86E;
    --teal:#7CBFBB;
    --teal-soft:#1E3230;
    --warn:#D9AA45;
    --critical:#E2685C;
    --critical-soft:#3B1E19;
    --critical-ink:#F4C9C1;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }

  *{ box-sizing:border-box; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; } }

  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent); color:var(--accent-ink); }
  a{ color:inherit; }
  button, input, select, textarea{ font-family:inherit; color:inherit; }
  input:focus-visible, select:focus-visible, button:focus-visible, [tabindex]:focus-visible{
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .app{ display:flex; flex-direction:column; height:100vh; min-height:600px; }

  /* ---------- HEADER ---------- */
  .topbar{
    flex:none;
    display:flex; flex-wrap:wrap; align-items:center; gap:14px;
    padding:14px 20px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
  }
  .brand{ display:flex; align-items:baseline; gap:10px; margin-right:auto; }
  .brand h1{
    font-family:var(--font-display); font-weight:800; font-size:26px; letter-spacing:.01em;
    margin:0; text-transform:uppercase; text-wrap:balance;
  }
  .brand .tag{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-faint); border:1px solid var(--border-strong); border-radius:999px;
    padding:2px 8px;
  }
  .tabs{ display:flex; gap:6px; background:var(--surface-2); padding:4px; border-radius:999px; border:1px solid var(--border); }
  .tab-btn{
    appearance:none; border:none; background:transparent; color:var(--ink-muted);
    font-family:var(--font-body); font-weight:600; font-size:13px;
    padding:8px 16px; border-radius:999px; cursor:pointer; white-space:nowrap;
  }
  .tab-btn[aria-selected="true"]{ background:var(--accent); color:var(--accent-ink); }
  .search-wrap{ position:relative; }
  .search-wrap input{
    width:230px; background:var(--surface-2); border:1px solid var(--border); color:var(--ink);
    border-radius:8px; padding:8px 12px 8px 30px; font-size:13px;
  }
  .search-wrap svg{ position:absolute; left:9px; top:50%; transform:translateY(-50%); opacity:.55; pointer-events:none; }
  .header-actions{ display:flex; align-items:center; gap:10px; }
  .changes-pill{
    font-family:var(--font-mono); font-size:12px; color:var(--teal); background:var(--teal-soft);
    border-radius:999px; padding:5px 11px; white-space:nowrap;
  }
  .btn{
    appearance:none; cursor:pointer; border-radius:8px; font-weight:600; font-size:13px;
    padding:8px 14px; border:1px solid var(--border-strong); background:var(--surface-2); color:var(--ink);
  }
  .btn:hover{ background:var(--surface-3); }
  .btn.danger-outline{ border-color: var(--critical); color:var(--critical); background:transparent; }
  .btn.danger-outline:hover{ background: var(--critical-soft); }

  /* ---------- LAYOUT ---------- */
  .layout{ flex:1; display:grid; grid-template-columns: 216px 1fr 380px; min-height:0; }
  @media (max-width: 1180px){ .layout{ grid-template-columns: 190px 1fr 340px; } }
  @media (max-width: 960px){
    .layout{ grid-template-columns: 1fr; }
    .nav{ display:none; }
  }

  .nav{
    border-right:1px solid var(--border); background:var(--surface); overflow-y:auto; padding:16px 10px;
  }
  .nav-title{ font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); padding:4px 10px 8px; }
  .nav-item{
    display:block; width:100%; text-align:left; background:none; border:none; cursor:pointer;
    color:var(--ink-muted); font-size:12.5px; padding:7px 10px; border-radius:7px; line-height:1.3;
  }
  .nav-item:hover{ background:var(--surface-2); color:var(--ink); }
  .nav-item.current{ background:var(--accent-soft); color:var(--accent-soft-ink); font-weight:600; }

  .content{ overflow-y:auto; padding:22px 26px 60px; }
  @media (max-width: 960px){ .content{ padding:18px 16px 40px; } }

  .content-intro{
    max-width:62ch; color:var(--ink-muted); font-size:13.5px; margin: 0 0 22px;
  }

  .section{ margin-bottom:34px; scroll-margin-top:16px; }
  .section h2{
    font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:.01em;
    text-transform:uppercase; margin:0 0 4px; padding-bottom:8px; border-bottom:2px solid var(--border-strong);
    text-wrap:balance;
  }
  .section-count{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); margin:0 0 14px; }

  .fields-grid{ display:flex; flex-direction:column; gap:2px; }
  .field{
    display:grid; grid-template-columns: minmax(0,1.15fr) minmax(0,1fr); gap:6px 24px;
    padding:13px 12px; border-radius:8px; border:1px solid transparent;
  }
  .field:hover{ background:var(--surface); }
  .field.modified{ border-color:var(--teal); background:var(--teal-soft); }
  @media (max-width: 720px){ .field{ grid-template-columns: 1fr; } }

  .field-info{ min-width:0; }
  .field-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .field-label{ font-weight:600; font-size:13.5px; }
  .mod-badge{
    font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.04em;
    background:var(--teal); color:var(--surface); border-radius:999px; padding:2px 7px;
  }
  .field-reset{
    background:none; border:none; cursor:pointer; color:var(--teal); font-size:11px; font-weight:600;
    padding:2px 4px; border-radius:5px; font-family:var(--font-mono);
  }
  .field-reset:hover{ text-decoration:underline; }
  .field-key{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); }
  .field-desc{ margin:4px 0 0; font-size:12.5px; color:var(--ink-muted); max-width:52ch; }

  .field-control{ display:flex; flex-direction:column; gap:6px; justify-content:center; min-width:0; }

  /* toggle switch */
  .switch-row{ display:flex; align-items:center; gap:10px; }
  .switch{ position:relative; display:inline-block; width:42px; height:24px; flex:none; }
  .switch input{ opacity:0; width:0; height:0; }
  .switch-track{
    position:absolute; inset:0; background:var(--surface-3); border:1px solid var(--border-strong);
    border-radius:999px; transition:background .15s ease;
  }
  .switch-track::before{
    content:""; position:absolute; width:16px; height:16px; left:3px; top:2px; background:var(--surface);
    border-radius:50%; transition:transform .15s ease; box-shadow:var(--shadow);
  }
  .switch input:checked + .switch-track{ background:var(--accent); border-color:var(--accent); }
  .switch input:checked + .switch-track::before{ transform:translateX(18px); background:var(--accent-ink); }
  .switch-state{ font-size:12.5px; font-weight:600; color:var(--ink-muted); font-family:var(--font-mono); }

  select.ctrl{
    background:var(--surface-2); border:1px solid var(--border-strong); color:var(--ink);
    border-radius:7px; padding:8px 10px; font-size:13px; width:100%; max-width:280px;
  }

  .range-row{ display:flex; align-items:center; gap:10px; }
  input[type="range"]{ flex:1; accent-color:var(--accent); min-width:80px; }
  input.num{
    width:88px; background:var(--surface-2); border:1px solid var(--border-strong); color:var(--ink);
    border-radius:7px; padding:7px 8px; font-family:var(--font-mono); font-size:13px; font-variant-numeric:tabular-nums;
  }
  .range-hint{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); }

  input.text-ctrl{
    width:100%; max-width:320px; background:var(--surface-2); border:1px solid var(--border-strong); color:var(--ink);
    border-radius:7px; padding:8px 10px; font-size:13px; font-family:var(--font-mono);
  }
  .pw-row{ display:flex; align-items:center; gap:6px; }
  .pw-toggle{
    background:var(--surface-2); border:1px solid var(--border-strong); border-radius:7px; cursor:pointer;
    font-size:11px; padding:8px 9px; color:var(--ink-muted); font-family:var(--font-mono);
  }
  .sensitive-note{
    display:flex; gap:8px; align-items:flex-start; background:var(--critical-soft); color:var(--critical-ink);
    border-radius:7px; padding:8px 10px; font-size:12px; margin-top:2px; max-width:320px;
  }
  .sensitive-note svg{ flex:none; margin-top:1px; }

  .no-results{ color:var(--ink-faint); font-size:13px; padding:30px 10px; text-align:center; }

  /* ---------- OUTPUT PANEL ---------- */
  .output{
    border-left:1px solid var(--border); background:var(--surface); display:flex; flex-direction:column; min-height:0;
  }
  @media (max-width: 960px){
    .output{ border-left:none; border-top:1px solid var(--border); max-height:46vh; }
  }
  .output-head{ padding:14px 16px 10px; border-bottom:1px solid var(--border); flex:none; }
  .output-head h3{ font-family:var(--font-display); font-weight:700; font-size:15px; text-transform:uppercase; margin:0 0 2px; }
  .output-head p{ margin:0; font-size:11.5px; color:var(--ink-faint); }
  .output-actions{ display:flex; gap:8px; padding:10px 16px; flex:none; }
  .output-actions .btn{ flex:1; }
  .output-actions .btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .output-actions .btn.primary:hover{ filter:brightness(1.08); }
  .copy-feedback{ font-size:11.5px; color:var(--teal); padding:0 16px 8px; min-height:16px; font-family:var(--font-mono); }
  .output-code-wrap{ flex:1; overflow:auto; padding:0 16px 16px; min-height:0; }
  textarea.output-code{
    width:100%; height:100%; min-height:260px; resize:none; background:var(--surface-2);
    border:1px solid var(--border-strong); border-radius:8px; color:var(--ink);
    font-family:var(--font-mono); font-size:11.5px; line-height:1.55; padding:12px;
    white-space:pre; overflow:auto;
  }

  [hidden]{ display:none !important; }
</style>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand">
      <h1>Console Duo</h1>
      <span class="tag">editor de config</span>
    </div>
    <div class="tabs" role="tablist" aria-label="Arquivo de configuração">
      <button class="tab-btn" data-tab="ini" role="tab" aria-selected="true">Servidor · server.ini</button>
      <button class="tab-btn" data-tab="lua" role="tab" aria-selected="false">Mundo &amp; Zumbis · SandboxVars.lua</button>
    </div>
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="search" placeholder="Buscar uma configuração…" autocomplete="off">
    </div>
    <div class="header-actions">
      <span class="changes-pill" id="changes-pill" hidden></span>
      <button class="btn danger-outline" id="reset-btn" hidden>Desfazer alterações</button>
    </div>
  </header>

  <div class="layout">
    <nav class="nav" id="nav" aria-label="Categorias"></nav>
    <main class="content" id="content"></main>
    <aside class="output" aria-label="Arquivo gerado">
      <div class="output-head">
        <h3 id="output-title">Duo.ini gerado</h3>
        <p id="output-sub">Atualiza sozinho a cada mudança à esquerda.</p>
      </div>
      <div class="output-actions">
        <button class="btn primary" id="copy-btn">Copiar arquivo</button>
      </div>
      <p class="copy-feedback" id="copy-feedback"></p>
      <div class="output-code-wrap">
        <textarea class="output-code" id="output-code" spellcheck="false" readonly></textarea>
      </div>
    </aside>
  </div>
</div>

<script>
const BUNDLE = {"iniSections":["PVP e combate entre jogadores","Chat e comunicação","Acesso e contas","Spawn de jogadores","Safehouses (casas seguras)","Facções","Voz (VOIP)","Rede e conexão","Visibilidade do servidor","RCON e integrações","Rádio","Mods e mapa","Backups e salvamento","Veículos","Mundo e simulação","Anti-cheat","Logs e moderação"],"luaSections":["Multiplicadores de XP por habilidade","População de zumbis","Loot — quantidade por categoria","Loot — regras gerais","Comportamento dos zumbis","População avançada (Zombie Config)","Sobrevivência do personagem","Combate e armas de fogo","Tempo e calendário","Clima","Infraestrutura e serviços","Natureza, agricultura e pesca","Animais","Veículos","Mapa e interface","Porões e eventos do mundo","Leitura, conhecimento e diversos"],"iniFields":[{"id":"ini.PVP","ph":"@@INI_PVP@@","section":"PVP e combate entre jogadores","label":"PVP ativado","desc":"Permite que jogadores causem dano e matem uns aos outros. Com isso desativado, ataques entre jogadores simplesmente não causam dano — é só cooperação.","value":"true","sensitive":false,"type":"toggle"},{"id":"ini.PVPLogToolChat","ph":"@@INI_PVPLogToolChat@@","section":"PVP e combate entre jogadores","label":"Registrar PVP no chat de admin","desc":"Toda vez que rolar PVP, aparece um aviso no chat dos administradores. Bom pra acompanhar sem precisar vasculhar arquivo de log.","value":"true","sensitive":false,"type":"toggle"},{"id":"ini.PVPLogToolFile","ph":"@@INI_PVPLogToolFile@@","section":"PVP e combate entre jogadores","label":"Registrar PVP em arquivo","desc":"Grava cada ocorrência de PVP num arquivo de log no servidor, além (ou no lugar) do chat de admin.","value":"true","sensitive":false,"type":"toggle"},{"id":"ini.PauseEmpty","ph":"@@INI_PauseEmpty@@","section":"Mundo e simulação","label":"Pausar o tempo quando não há ninguém online","desc":"O relógio do jogo para de passar quando o servidor está vazio, em vez de continuar avançando (o que faria comida estragar, geradores gastarem combustível etc. mesmo sem ninguém jogando).","value":"true","sensitive":false,"type":"toggle"},{"id":"ini.GlobalChat","ph":"@@INI_GlobalChat@@","section":"Chat e comunicação","label":"Chat global ativado","desc":"Liga ou desliga o canal de chat geral do servidor.","value":"true","sensitive":false,"type":"toggle"},{"id":"ini.ChatStreams","ph":"@@INI_ChatStreams@@","section":"Chat e comunicação","label":"Canais de chat ativos","desc":"Lista, separada por vírgula, de quais canais de chat existem no servidor: s=geral, r=rádio, a=admin, w=sussurro, y=grito, sh=segurança(safehouse), f=facção, all=todos-veem-tudo. Só mexa aqui se souber exatamente o que quer remover.","value":"s,r,a,w,y,sh,f,all","sensitive":false,"type":"text"},{"id":"ini.Open","ph":"@@INI_Open@@","section":"Acesso e contas","label":"Servidor aberto (sem whitelist)","desc":"Com isso ativado, qualquer pessoa com a senha (se houver) pode entrar e criar a própria conta na hora. Desativando, só quem já tem usuário/senha criado manualmente pelo admin consegue entrar.","value":"true","sensitive":false,"type":"toggle"},{"id":"ini.ServerWelcomeMessage","ph":"@@INI_ServerWelcomeMessage@@","section":"Chat e comunicação","label":"Mensagem de boas-vindas","desc":"Texto que aparece no chat assim que alguém entra no servidor. Use <LINE> pra quebrar linha, e códigos tipo <RGB:1,0,0> antes de um trecho pra colorir o texto (nesse exemplo, vermelho).","value":"Bora se divertir caralho! <LINE> <LINE> Pau no cu do mudo.","sensitive":false,"type":"text"},{"id":"ini.DisplayUserName","ph":"@@INI_DisplayUserName@@","section":"Chat e comunicação","label":"Mostrar nome de usuário acima da cabeça","desc":"Exibe o nome da conta Steam/usuário flutuando sobre o personagem de cada jogador.","value":"true","sensitive":false,"type":"toggle"},{"id":"ini.ShowFirstAndLastName","ph":"@@INI_ShowFirstAndLastName@@","section":"Chat e comunicação","label":"Mostrar nome e sobrenome do personagem","desc":"Além do nome de usuário, também mostra o nome do personagem escolhido na criação (o nome 'de ficção', não o da conta).","value":"false","sensitive":false,"type":"toggle"},{"id":"ini.UsernameDisguises","ph":"@@INI_UsernameDisguises@@","section":"Chat e comunicação","label":"Permitir disfarçar nome de usuário","desc":"Deixa o jogo mostrar um nome diferente (disfarce) em vez do nome de usuário real acima da cabeça — recurso ligado a roupas/disfarces do jogo.","value":"false","sensitive":false,"type":"toggle"},{"id":"ini.HideDisguisedUserName","ph":"@@INI_HideDisguisedUserName@@","section":"Chat e comunicação","label":"Ocultar nome real de quem está disfarçado","desc":"Quando alguém está usando um disfarce, esconde completamente o nome de usuário verdadeiro (em vez de só trocar o texto exibido).","value":"false","sensitive":false,"type":"toggle"},{"id":"ini.SwitchZombiesOwnershipEachUpdate","ph":"@@INI_SwitchZombiesOwnershipEachUpdate@@","section":"Spawn de jogadores","label":"Trocar 'dono' dos zumbis a cada atualização","desc":"Configuração técnica de rede: redistribui qual cliente é responsável por simular cada zumbi a cada ciclo. Pode ajudar ou atrapalhar performance dependendo do servidor — não mexa sem necessidade.","value":"false","sensitive":false,"type":"toggle"},{"id":"ini.SpawnPoint","ph":"@@INI_SpawnPoint@@","section":"Spawn de jogadores","label":"Ponto de spawn fixo (x,y,z)","desc":"Força todo personagem novo a nascer nessas coordenadas exatas do mapa (consulte map.projectzomboid.com pra achar coordenadas). Deixe 0,0,0 pra usar o spawn normal/aleatório do jogo.","value":"0,0,0","sensitive":false,"type":"text"},{"id":"ini.SafetySystem","ph":"@@INI_SafetySystem@@","section":"PVP e combate entre jogadores","label":"Sistema de segurança (entrar/sair do PVP)","desc":"Com isso ativado, cada jogador escolhe individualmente quando 'ligar' o PVP (aparece uma caveira na tela). Só rola dano se pelo menos um dos dois estiver com PVP ativado. Desativando, PVP fica sempre valendo pra todo mundo o tempo todo, sem esse controle manual.","value":"true","sensitive":false,"type":"toggle"},{"id":"ini.ShowSafety","ph":"@@INI_ShowSafety@@","section":"PVP e combate entre jogadores","label":"Mostrar ícone de PVP ativo","desc":"Exibe o ícone de caveira acima da cabeça de quem está com o modo PVP ligado, pra dar pra saber quem pode te atacar.","value":"true","sensitive":false,"type":"toggle"},{"id":"ini.SafetyToggleTimer","ph":"@@INI_SafetyToggleTimer@@","section":"PVP e combate entre jogadores","label":"Tempo pra entrar/sair do PVP (segundos)","desc":"Quanto tempo o jogador precisa segurar/esperar pra ativar ou desativar o próprio modo PVP.","value":"2","sensitive":false,"type":"range","min":0.0,"max":1000.0,"decimals":0},{"id":"ini.SafetyCooldownTimer","ph":"@@INI_SafetyCooldownTimer@@","section":"PVP e combate entre jogadores","label":"Cooldown entre trocas de PVP (segundos)","desc":"Depois de mudar o estado do PVP, esse é o tempo que o jogador precisa esperar antes de poder mudar de novo — evita ficar ligando/desligando pra escapar de brigas.","value":"3","sensitive":false,"type":"range","min":0.0,"max":1000.0,"decimals":0},{"id":"ini.SafetyDisconnectDelay","ph":"@@INI_SafetyDisconnectDelay@@","section":"PVP e combate entre jogadores","label":"Atraso de desconexão em PVP (segundos)","desc":"Se um jogador com PVP ativo tentar sair do jogo, ele fica visível/vulnerável por esse tempo antes de desconectar de fato — evita o famoso 'combat log' pra escapar de uma luta.","value":"60","sensitive":false,"type":"range","min":0.0,"max":60.0,"decimals":0},{"id":"ini.SpawnItems","ph":"@@INI_SpawnItems@@","section":"Spawn de jogadores","label":"Itens iniciais","desc":"Lista de itens (formato Base.NomeDoItem, separados por vírgula) que todo personagem novo já começa carregando, além do kit padrão do jogo.","value":"Base.Bag_Schoolbag,Base.WaterBottleFull,Base.Boxofcrackers,Base.Crowbar,Base.Hammer,Base.Bandage","sensitive":false,"type":"text"},{"id":"ini.DefaultPort","ph":"@@INI_DefaultPort@@","section":"Rede e conexão","label":"Porta principal (TCP/UDP)","desc":"Porta usada para a comunicação principal entre clientes e servidor. Precisa estar liberada no roteador/firewall.","value":"16261","sensitive":false,"type":"range","min":0.0,"max":65535.0,"decimals":0},{"id":"ini.UDPPort","ph":"@@INI_UDPPort@@","section":"Rede e conexão","label":"Porta UDP secundária","desc":"Segunda porta usada junto da principal para tráfego UDP.","value":"16262","sensitive":false,"type":"range","min":0.0,"max":65535.0,"decimals":0},{"id":"ini.ResetID","ph":"@@INI_ResetID@@","section":"Rede e conexão","label":"ID de reset (identificador de soft-reset)","desc":"Usado internamente para saber se o servidor passou por um 'soft reset'. Se esse número não bater com o do cliente, a pessoa é obrigada a criar um personagem novo. Vale guardar esse valor em algum lugar seguro antes de mexer.","value":"2395835","sensitive":false,"type":"range","min":0.0,"max":2147483647.0,"decimals":0},{"id":"ini.Mods","ph":"@@INI_Mods@@","section":"Mods e mapa","label":"IDs dos mods","desc":"IDs de carregamento dos mods instalados. Cada mod te dá um ID pra colocar aqui, encontrado dentro da pasta do Workshop.","value":"","sensitive":false,"type":"text"},{"id":"ini.Map","ph":"@@INI_Map@@","section":"Mods e mapa","label":"Mapa do servidor","desc":"Nome da pasta do mapa a ser usado. 'Muldraugh, KY' é o mapa padrão do jogo.","value":"Muldraugh, KY","sensitive":false,"type":"text"},{"id":"ini.DoLuaChecksum","ph":"@@INI_DoLuaChecksum@@","section":"Rede e conexão","label":"Verificar integridade dos arquivos do jogo (checksum)","desc":"Expulsa clientes cujos arquivos de jogo/mods não batem exatamente com os do servidor. Costuma precisar ficar desativado se vocês forem usar ferramentas que modificam arquivos Lua do servidor em tempo real, como painéis de administração com 'bridge'.","value":"true","sensitive":false,"type":"toggle"},{"id":"ini.DenyLoginOnOverloadedServer","ph":"@@INI_DenyLoginOnOverloadedServer@@","section":"Acesso e contas","label":"Recusar login se o servidor estiver sobrecarregado","desc":"Impede novas conexões automaticamente se o servidor detectar que está com desempenho ruim demais no momento.","value":"true","sensitive":false,"type":"toggle"},{"id":"ini.Public","ph":"@@INI_Public@@","section":"Visibilidade do servidor","label":"Listar servidor publicamente","desc":"Se ativado, o servidor aparece no navegador de servidores dentro do jogo pra qualquer pessoa encontrar (servidores com Steam sempre aparecem na lista da Steam, independente dessa opção).","value":"false","sensitive":false,"type":"toggle"},{"id":"ini.PublicName","ph":"@@INI_PublicName@@","section":"Visibilidade do servidor","label":"Nome público do servidor","desc":"Nome exibido na lista de servidores.","value":"Duo","sensitive":false,"type":"text"},{"id":"ini.PublicDescription","ph":"@@INI_PublicDescription@@","section":"Visibilidade do servidor","label":"Descrição pública","desc":"Texto de descrição mostrado na lista de servidores. Um espaço duplo cria uma quebra de linha.","value":"","sensitive":false,"type":"text"},{"id":"ini.MaxPlayers","ph":"@@INI_MaxPlayers@@","section":"Acesso e contas","label":"Máximo de jogadores simultâneos","desc":"Quantas pessoas podem estar conectadas ao mesmo tempo (sem contar admins). Valores acima de 32 podem causar lag e dessincronização do mapa — vá com calma.","value":"16","sensitive":false,"type":"range","min":1.0,"max":254.0,"decimals":0},{"id":"ini.PingLimit","ph":"@@INI_PingLimit@@","section":"Acesso e contas","label":"Limite de ping (ms) antes de expulsar","desc":"Se a conexão de alguém ficar mais lenta que esse valor, o jogo expulsa a pessoa automaticamente. Zero desativa esse limite.","value":"400","sensitive":false,"type":"range","min":0.0,"max":2147483647.0,"decimals":0},{"id":"ini.SafehousePreventsLootRespawn","ph":"@@INI_SafehousePreventsLootRespawn@@","section":"Safehouses (casas seguras)","label":"Safehouse impede respawn de loot","desc":"Itens não voltam a aparecer em containers dentro de prédios que os jogadores já marcaram como área segura.","value":"true","sensitive":false,"type":"toggle"},{"id":"ini.DropOffWhiteListAfterDeath","ph":"@@INI_DropOffWhiteListAfterDeath@@","section":"Acesso e contas","label":"Remover da whitelist ao morrer","desc":"Em servidores fechados (Open=não), remove automaticamente o jogador da lista de permitidos quando o personagem morre — obrigando a pedir acesso de novo pra criar um novo personagem.","value":"false","sensitive":false,"type":"toggle"},{"id":"ini.NoFire","ph":"@@INI_NoFire@@","section":"Mundo e simulação","label":"Desativar fogo (exceto fogueiras)","desc":"Desliga todas as formas de fogo espalhando/causando dano no mundo, com exceção de fogueiras controladas.","value":"false","sensitive":false,"type":"toggle"},{"id":"ini.AnnounceDeath","ph":"@@INI_AnnounceDeath@@","section":"Mundo e simulação","label":"Anunciar morte de jogador no chat global","desc":"Toda vez que um jogador morre, aparece uma mensagem pra todo mundo no servidor.","value":"false","sensitive":false,"type":"toggle"},{"id":"ini.AnnounceAnimalDeath","ph":"@@INI_AnnounceAnimalDeath@@","section":"Mundo e simulação","label":"Anunciar morte de animal no chat global","desc":"Mesma ideia, mas pra quando um animal (de fazenda, por exemplo) morre.","value":"false","sensitive":false,"type":"toggle"},{"id":"ini.SaveWorldEveryMinutes","ph":"@@INI_SaveWorldEveryMinutes@@","section":"Backups e salvamento","label":"Salvar mundo a cada X minutos","desc":"De quanto em quanto tempo real o servidor grava no disco as partes do mapa carregadas — normalmente ele só salva quando os jogadores saem de uma área, isso força um salvamento periódico independente disso.","value":"15","sensitive":false,"type":"range","min":0.0,"max":2147483647.0,"decimals":0},{"id":"ini.PlayerSafehouse","ph":"@@INI_PlayerSafehouse@@","section":"Safehouses (casas seguras)","label":"Jogadores podem reivindicar safehouse","desc":"Permite que qualquer jogador (não só admins) marque uma casa como sua área segura, protegida de outros jogadores.","value":"true","sensitive":false,"type":"toggle"},{"id":"ini.AdminSafehouse","ph":"@@INI_AdminSafehouse@@","section":"Safehouses (casas seguras)","label":"Só admins podem reivindicar safehouse","desc":"Restringe a criação de casas seguras apenas para administradores.","value":"false","sensitive":false,"type":"toggle"},{"id":"ini.SafehouseAllowTrepass","ph":"@@INI_SafehouseAllowTrepass@@","section":"Safehouses (casas seguras)","label":"Permitir invasão por quem não é membro","desc":"Se ativado, jogadores de fora podem simplesmente entrar numa safehouse alheia sem convite (mas ainda sem poder roubar/destruir, a menos que outras opções liberem isso).","value":"false","sensitive":false,"type":"toggle"},{"id":"ini.SafehouseAllowFire","ph":"@@INI_SafehouseAllowFire@@","section":"Safehouses (casas seguras)","label":"Fogo pode danificar safehouse","desc":"Se desativado, incêndios não conseguem destruir uma casa marcada como segura.","value":"true","sensitive":false,"type":"toggle"},{"id":"ini.SafehouseAllowLoot","ph":"@@INI_SafehouseAllowLoot@@","section":"Safehouses (casas seguras)","label":"Permitir saque por quem não é membro","desc":"Libera que jogadores de fora peguem itens de dentro de uma safehouse que não é deles.","value":"false","sensitive":false,"type":"toggle"},{"id":"ini.SafehouseAllowRespawn","ph":"@@INI_SafehouseAllowRespawn@@","section":"Safehouses (casas seguras)","label":"Respawn na última safehouse","desc":"Ao morrer, o jogador pode renascer numa casa segura da qual era membro.","value":"false","sensitive":false,"type":"toggle"},{"id":"ini.SafehouseDaySurvivedToClaim","ph":"@@INI_SafehouseDaySurvivedToClaim@@","section":"Safehouses (casas seguras)","label":"Dias de sobrevivência pra poder reivindicar","desc":"Quantos dias em jogo o personagem precisa ter sobrevivido antes de poder marcar uma casa como segura.","value":"0","sensitive":false,"type":"range","min":0.0,"max":2147483647.0,"decimals":0},{"id":"ini.SafeHouseRemovalTime","ph":"@@INI_SafeHouseRemovalTime@@","section":"Safehouses (casas seguras)","label":"Horas reais sem visitar até perder a safehouse","desc":"Se um membro fica esse número de horas reais sem aparecer na casa, ele é removido automaticamente da lista de donos.","value":"144","sensitive":false,"type":"range","min":0.0,"max":2147483647.0,"decimals":0},{"id":"ini.SafehouseAllowNonResidential","ph":"@@INI_SafehouseAllowNonResidential@@","section":"Safehouses (casas seguras)","label":"Permitir safehouse em prédio não-residencial","desc":"Libera reivindicar lojas, postos, prédios comerciais etc. como casa segura, não só residências.","value":"true","sensitive":false,"type":"toggle"},{"id":"ini.SafehouseDisableDisguises","ph":"@@INI_SafehouseDisableDisguises@@","section":"Safehouses (casas seguras)","label":"Desativar disfarces dentro de safehouse","desc":"Impede o uso de disfarces de nome enquanto o jogador está dentro de uma área marcada como segura.","value":"true","sensitive":false,"type":"toggle"},{"id":"ini.MaxSafezoneSize","ph":"@@INI_MaxSafezoneSize@@","section":"Safehouses (casas seguras)","label":"Tamanho máximo da área segura","desc":"Limite de tamanho (em tiles) que uma safehouse pode ter.","value":"20000","sensitive":false,"type":"range","min":0.0,"max":2147483647.0,"decimals":0},{"id":"ini.AllowDestructionBySledgehammer","ph":"@@INI_AllowDestructionBySledgehammer@@","section":"Safehouses (casas seguras)","label":"Permitir destruir estruturas com marreta","desc":"Libera usar marretas pra derrubar paredes/construções feitas por jogadores.","value":"true","sensitive":false,"type":"toggle"},{"id":"ini.SledgehammerOnlyInSafehouse","ph":"@@INI_SledgehammerOnlyInSafehouse@@","section":"Safehouses (casas seguras)","label":"Marreta só funciona dentro da própria safehouse","desc":"Restringe o uso de marretas contra construções apenas dentro da área segura de quem está usando (exige a opção acima ativada).","value":"false","sensitive":false,"type":"toggle"},{"id":"ini.War","ph":"@@INI_War@@","section":"PVP e combate entre jogadores","label":"Modo guerra","desc":"Ativa um evento programado de guerra entre facções, com início e duração definidos abaixo. É um recurso avançado — só ative se vocês quiserem esse tipo de evento.","value":"false","sensitive":false,"type":"toggle"},{"id":"ini.WarStartDelay","ph":"@@INI_WarStartDelay@@","section":"PVP e combate entre jogadores","label":"Atraso pro início da guerra (segundos)","desc":"Quanto tempo depois do servidor ligar até o modo guerra começar, quando ativado.","value":"600","sensitive":false,"type":"range","min":60.0,"max":2147483647.0,"decimals":0},{"id":"ini.WarDuration","ph":"@@INI_WarDuration@@","section":"PVP e combate entre jogadores","label":"Duração da guerra (segundos)","desc":"Por quanto tempo o evento de guerra fica ativo depois de começar.","value":"3600","sensitive":false,"type":"range","min":60.0,"max":2147483647.0,"decimals":0},{"id":"ini.WarSafehouseHitPoints","ph":"@@INI_WarSafehouseHitPoints@@","section":"PVP e combate entre jogadores","label":"Vida das safehouses durante a guerra","desc":"Quantos golpes uma casa segura aguenta antes de ser invadida durante o modo guerra.","value":"3","sensitive":false,"type":"range","min":0.0,"max":2147483647.0,"decimals":0},{"id":"ini.ServerPlayerID","ph":"@@INI_ServerPlayerID@@","section":"Rede e conexão","label":"ID do servidor (identificador de personagem)","desc":"Usado junto com o ID de reset pra diferenciar personagens desse servidor de personagens de outro servidor ou do singleplayer. Normalmente não precisa mexer aqui manualmente.","value":"","sensitive":false,"type":"text"},{"id":"ini.RCONPort","ph":"@@INI_RCONPort@@","section":"RCON e integrações","label":"Porta do RCON","desc":"Porta usada pelo console remoto (RCON), que é o que ferramentas como painéis de administração usam pra mandar comandos ao servidor de fora do jogo.","value":"27015","sensitive":false,"type":"range","min":0.0,"max":65535.0,"decimals":0},{"id":"ini.RCONPassword","ph":"@@INI_RCONPassword@@","section":"RCON e integrações","label":"Senha do RCON","desc":"Senha exigida por qualquer ferramenta que queira se conectar ao RCON do servidor. Por segurança esse campo não vem pré-preenchido com o valor atual — defina uma senha forte aqui se for habilitar RCON.","value":"","sensitive":true,"type":"password"},{"id":"ini.DiscordEnable","ph":"@@INI_DiscordEnable@@","section":"RCON e integrações","label":"Integração com Discord ativada","desc":"Liga a ponte de chat entre o servidor e um canal do Discord.","value":"false","sensitive":false,"type":"toggle"},{"id":"ini.DiscordToken","ph":"@@INI_DiscordToken@@","section":"RCON e integrações","label":"Token do bot do Discord","desc":"Token de acesso do bot do Discord usado na integração. É uma credencial sensível — não fica pré-preenchida aqui.","value":"","sensitive":true,"type":"password"},{"id":"ini.DiscordChatChannel","ph":"@@INI_DiscordChatChannel@@","section":"RCON e integrações","label":"Canal do Discord pro chat","desc":"Nome do canal do Discord que vai espelhar o chat geral do jogo.","value":"","sensitive":false,"type":"text"},{"id":"ini.DiscordLogChannel","ph":"@@INI_DiscordLogChannel@@","section":"RCON e integrações","label":"Canal do Discord pros logs","desc":"Nome do canal do Discord que vai receber logs do servidor.","value":"","sensitive":false,"type":"text"},{"id":"ini.DiscordCommandChannel","ph":"@@INI_DiscordCommandChannel@@","section":"RCON e integrações","label":"Canal do Discord pra comandos","desc":"Nome do canal do Discord de onde é possível mandar comandos pro servidor.","value":"","sensitive":false,"type":"text"},{"id":"ini.WebhookAddress","ph":"@@INI_WebhookAddress@@","section":"RCON e integrações","label":"Webhook do Slack","desc":"URL de um webhook do Slack, se vocês quiserem receber notificações do servidor lá em vez de/além do Discord.","value":"","sensitive":false,"type":"text"},{"id":"ini.Password","ph":"@@INI_Password@@","section":"Acesso e contas","label":"Senha do servidor","desc":"Senha que o jogador precisa digitar pra entrar no servidor. Por segurança, o valor atual não fica pré-carregado aqui — deixe em branco pra manter a senha como está, ou digite uma nova senha pra trocá-la.","value":"","sensitive":true,"type":"password"},{"id":"ini.MaxAccountsPerUser","ph":"@@INI_MaxAccountsPerUser@@","section":"Acesso e contas","label":"Máximo de contas por usuário Steam","desc":"Quantos personagens/contas diferentes uma mesma conta Steam pode criar nesse servidor. Zero significa sem limite.","value":"0","sensitive":false,"type":"range","min":0.0,"max":2147483647.0,"decimals":0},{"id":"ini.AllowCoop","ph":"@@INI_AllowCoop@@","section":"Acesso e contas","label":"Permitir splitscreen/coop local","desc":"Libera que uma mesma conexão traga mais de um jogador junto (tela dividida ou Remote Play).","value":"true","sensitive":false,"type":"toggle"},{"id":"ini.SleepAllowed","ph":"@@INI_SleepAllowed@@","section":"Mundo e simulação","label":"Permitir dormir","desc":"Os jogadores podem dormir quando o personagem estiver cansado, mesmo sem ser obrigatório.","value":"true","sensitive":false,"type":"toggle"},{"id":"ini.SleepNeeded","ph":"@@INI_SleepNeeded@@","section":"Mundo e simulação","label":"Exigir sono","desc":"Torna o sono uma necessidade real — o personagem sofre penalidades se não dormir. Só faz efeito se dormir estiver permitido.","value":"false","sensitive":false,"type":"toggle"},{"id":"ini.KnockedDownAllowed","ph":"@@INI_KnockedDownAllowed@@","section":"Mundo e simulação","label":"Permitir ficar caído/derrubado","desc":"Recurso experimental do próprio jogo (WIP): ativar pode causar leve dessincronização visual da posição dos jogadores.","value":"true","sensitive":false,"type":"toggle"},{"id":"ini.SneakModeHideFromOtherPlayers","ph":"@@INI_SneakModeHideFromOtherPlayers@@","section":"Mundo e simulação","label":"Modo furtivo esconde de outros jogadores","desc":"Quando ativado no modo furtivo, o personagem também fica mais difícil de ser visto por outros jogadores (não só por zumbis).","value":"true","sensitive":false,"type":"toggle"},{"id":"ini.UltraSpeedDoesnotAffectToAnimals","ph":"@@INI_UltraSpeedDoesnotAffectToAnimals@@","section":"Mundo e simulação","label":"Velocidade ultra-rápida não afeta animais","desc":"Ao usar a velocidade de tempo mais rápida disponível, os animais continuam se comportando na velocidade normal em vez de acelerar junto.","value":"false","sensitive":false,"type":"toggle"},{"id":"ini.WorkshopItems","ph":"@@INI_WorkshopItems@@","section":"Mods e mapa","label":"IDs do Workshop pra baixar","desc":"Lista de IDs de itens do Steam Workshop (separados por ponto e vírgula) que o servidor deve baixar automaticamente.","value":"","sensitive":false,"type":"text"},{"id":"ini.SteamScoreboard","ph":"@@INI_SteamScoreboard@@","section":"Visibilidade do servidor","label":"Mostrar nomes/avatares Steam na lista de jogadores","desc":"Exibe o nome de usuário e avatar da Steam na lista de jogadores conectados.","value":"true","sensitive":false,"type":"toggle"},{"id":"ini.SteamVAC","ph":"@@INI_SteamVAC@@","section":"Visibilidade do servidor","label":"Proteção Steam VAC","desc":"Ativa o sistema anti-cheat da própria Valve.","value":"true","sensitive":false,"type":"toggle"},{"id":"ini.UPnP","ph":"@@INI_UPnP@@","section":"Rede e conexão","label":"UPnP (abrir portas automaticamente)","desc":"Tenta configurar automaticamente o roteador pra abrir as portas necessárias. Se falhar, o servidor volta a usar as portas padrão — nesse caso, o encaminhamento de porta precisa ser feito manualmente.","value":"true","sensitive":false,"type":"toggle"},{"id":"ini.VoiceEnable","ph":"@@INI_VoiceEnable@@","section":"Voz (VOIP)","label":"Chat de voz ativado","desc":"Liga ou desliga completamente a comunicação por voz no servidor.","value":"true","sensitive":false,"type":"toggle"},{"id":"ini.VoiceMinDistance","ph":"@@INI_VoiceMinDistance@@","section":"Voz (VOIP)","label":"Distância mínima de alcance da voz","desc":"A partir de qual distância (em tiles) o volume da voz começa a diminuir com a distância.","value":"10.0","sensitive":false,"type":"range","min":0.0,"max":100000.0,"decimals":1},{"id":"ini.VoiceMaxDistance","ph":"@@INI_VoiceMaxDistance@@","section":"Voz (VOIP)","label":"Distância máxima de alcance da voz","desc":"Distância (em tiles) a partir da qual a voz de outro jogador já não é mais ouvida.","value":"100.0","sensitive":false,"type":"range","min":0.0,"max":100000.0,"decimals":1},{"id":"ini.Voice3D","ph":"@@INI_Voice3D@@","section":"Voz (VOIP)","label":"Áudio direcional (3D)","desc":"Com isso ativado, dá pra perceber de que direção a voz de outro jogador está vindo, em vez de um volume igual em todo canto.","value":"true","sensitive":false,"type":"toggle"},{"id":"ini.SpeedLimit","ph":"@@INI_SpeedLimit@@","section":"Mundo e simulação","label":"Limite de velocidade de simulação","desc":"Teto técnico de velocidade usado pela simulação do jogo — configuração avançada, normalmente não precisa mexer.","value":"70.0","sensitive":false,"type":"range","min":10.0,"max":150.0,"decimals":1},{"id":"ini.LoginQueueEnabled","ph":"@@INI_LoginQueueEnabled@@","section":"Acesso e contas","label":"Fila de entrada ativada","desc":"Se o servidor estiver lotado, novas conexões esperam numa fila em vez de serem simplesmente recusadas.","value":"false","sensitive":false,"type":"toggle"},{"id":"ini.LoginQueueConnectTimeout","ph":"@@INI_LoginQueueConnectTimeout@@","section":"Acesso e contas","label":"Tempo limite na fila (segundos)","desc":"Quanto tempo alguém pode ficar esperando na fila de entrada antes do jogo desistir da conexão.","value":"60","sensitive":false,"type":"range","min":20.0,"max":1200.0,"decimals":0},{"id":"ini.server_browser_announced_ip","ph":"@@INI_server_browser_announced_ip@@","section":"Rede e conexão","label":"IP anunciado no navegador de servidores","desc":"Só necessário se
