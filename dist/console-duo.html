erConfig_Pottery@@","section":"Multiplicadores de XP por habilidade","label":"Cerâmica","desc":"Velocidade de progresso na habilidade de olaria.","value":"1.0","type":"range","min":0.0,"max":1000.0,"decimals":1},{"id":"lua.MultiplierConfig.Carving","ph":"@@LUA_MultiplierConfig_Carving@@","section":"Multiplicadores de XP por habilidade","label":"Entalhe","desc":"Velocidade de progresso na habilidade de esculpir madeira.","value":"1.0","type":"range","min":0.0,"max":1000.0,"decimals":1},{"id":"lua.MultiplierConfig.Husbandry","ph":"@@LUA_MultiplierConfig_Husbandry@@","section":"Multiplicadores de XP por habilidade","label":"Cuidado com animais","desc":"Velocidade de progresso na habilidade de criar e cuidar de animais.","value":"1.0","type":"range","min":0.0,"max":1000.0,"decimals":1},{"id":"lua.MultiplierConfig.Tracking","ph":"@@LUA_MultiplierConfig_Tracking@@","section":"Multiplicadores de XP por habilidade","label":"Rastreamento","desc":"Velocidade de progresso na habilidade de rastrear animais.","value":"1.0","type":"range","min":0.0,"max":1000.0,"decimals":1},{"id":"lua.MultiplierConfig.Blacksmith","ph":"@@LUA_MultiplierConfig_Blacksmith@@","section":"Multiplicadores de XP por habilidade","label":"Ferraria","desc":"Velocidade de progresso na habilidade de forjar metal.","value":"1.0","type":"range","min":0.0,"max":1000.0,"decimals":1},{"id":"lua.MultiplierConfig.Butchering","ph":"@@LUA_MultiplierConfig_Butchering@@","section":"Multiplicadores de XP por habilidade","label":"Açougue","desc":"Velocidade de progresso na habilidade de abater e processar carne.","value":"1.0","type":"range","min":0.0,"max":1000.0,"decimals":1},{"id":"lua.MultiplierConfig.Glassmaking","ph":"@@LUA_MultiplierConfig_Glassmaking@@","section":"Multiplicadores de XP por habilidade","label":"Vidraria","desc":"Velocidade de progresso na habilidade de trabalhar com vidro.","value":"1.0","type":"range","min":0.0,"max":1000.0,"decimals":1}],"iniTemplate":"# Players can hurt and kill other players\nPVP=@@INI_PVP@@\n\n# PVP is logged to admin chat\nPVPLogToolChat=@@INI_PVPLogToolChat@@\n\n# PVP is logged to file\nPVPLogToolFile=@@INI_PVPLogToolFile@@\n\n# Game time stops when there are no players online\nPauseEmpty=@@INI_PauseEmpty@@\n\n# Toggles global chat on or off.\nGlobalChat=@@INI_GlobalChat@@\n\nChatStreams=@@INI_ChatStreams@@\n\n# Clients may join without already having an account in the whitelist. If set to false, administrators must manually create username/password combos.\nOpen=@@INI_Open@@\n\n# The first welcome message visible in the chat panel. This will be displayed immediately after player login. you can use RGB colours to chance the colour of the welcome message. You can also use < LINE>, without the space, to create a separate lines within your text. Use: \\<RGB:1,0,0> This message will show up red!\nServerWelcomeMessage=@@INI_ServerWelcomeMessage@@\n\n# Display usernames above player's heads in-game.\nDisplayUserName=@@INI_DisplayUserName@@\n\n# Display first & last name above player's heads.\nShowFirstAndLastName=@@INI_ShowFirstAndLastName@@\n\nUsernameDisguises=@@INI_UsernameDisguises@@\n\nHideDisguisedUserName=@@INI_HideDisguisedUserName@@\n\nSwitchZombiesOwnershipEachUpdate=@@INI_SwitchZombiesOwnershipEachUpdate@@\n\n# Force every new player to spawn at these set x,y,z world coordinates. Find desired coordinates at map.projectzomboid.com. (Ignored when 0,0,0)\nSpawnPoint=@@INI_SpawnPoint@@\n\n# Players can enter and leave PVP on an individual basis. A player can only hurt another player when at least one of them is in PVP mode - as shown by the unobscured skull and crossbones on the left of the screen. When SafetySystem=false, players are free to hurt each other at any time if PVP is enabled.\nSafetySystem=@@INI_SafetySystem@@\n\n# Display a skull icon over the head of players who have entered PVP mode\nShowSafety=@@INI_ShowSafety@@\n\n# The time it takes for a player to enter and leave PVP mode Min: 0 Max: 1000 Default: 2\nSafetyToggleTimer=@@INI_SafetyToggleTimer@@\n\n# The delay before a player can enter or leave PVP mode again, having recently done so Min: 0 Max: 1000 Default: 3\nSafetyCooldownTimer=@@INI_SafetyCooldownTimer@@\n\n# Min: 0 Max: 60 Default: 60\nSafetyDisconnectDelay=@@INI_SafetyDisconnectDelay@@\n\n# Item types new players spawn with. Separate multiple item types with commas. Example: Base.Axe,Base.Bag_BigHikingBag\nSpawnItems=@@INI_SpawnItems@@\n\n# Default starting port for player data. If UDP, this is this one of two ports used. Min: 0 Max: 65535 Default: 16261\nDefaultPort=@@INI_DefaultPort@@\n\n# Min: 0 Max: 65535 Default: 16262\nUDPPort=@@INI_UDPPort@@\n\n# Reset ID determines if the server has undergone a soft-reset. If this number does match the client, the client must create a new character. Used in conjunction with PlayerServerID. It is strongly advised that you backup these IDs somewhere Min: 0 Max: 2147483647 Default: 891661716\nResetID=@@INI_ResetID@@\n\n# Enter the mod loading ID here. It can be found in \\Steam\\steamapps\\workshop\\modID\\mods\\modName\\info.txt\nMods=@@INI_Mods@@\n\n# Enter the foldername of the mod found in \\Steam\\steamapps\\workshop\\modID\\mods\\modName\\media\\maps\\\nMap=@@INI_Map@@\n\n# Kick clients whose game files don't match the server's.\nDoLuaChecksum=@@INI_DoLuaChecksum@@\n\nDenyLoginOnOverloadedServer=@@INI_DenyLoginOnOverloadedServer@@\n\n# Shows the server on the in-game browser. (Note: Steam-enabled servers are always visible in the Steam server browser)\nPublic=@@INI_Public@@\n\n# Name of the server displayed in the in-game browser and, if applicable, the Steam browser\nPublicName=@@INI_PublicName@@\n\n# Description displayed in the in-game public server browser. Typing   will create a new line in your description\nPublicDescription=@@INI_PublicDescription@@\n\n# Maximum number of players that can be on the server at one time. This excludes admins.\n# WARNING: Server player counts above 32 will potentially result in poor map streaming and desync. Please advance with caution. Min: 1 Max: 254 Default: 32\nMaxPlayers=@@INI_MaxPlayers@@\n\n# Ping limit, in milliseconds, before a player is kicked from the server. (Set to 0 to disable) Min: 0 Max: 2147483647 Default: 0\nPingLimit=@@INI_PingLimit@@\n\n# Items will not respawn in buildings that players have claimed as a safehouse\nSafehousePreventsLootRespawn=@@INI_SafehousePreventsLootRespawn@@\n\n# Remove player accounts from the whitelist after death. This prevents players creating a new character after death on Open=false servers\nDropOffWhiteListAfterDeath=@@INI_DropOffWhiteListAfterDeath@@\n\n# All forms of fire are disabled - except for campfires\nNoFire=@@INI_NoFire@@\n\n# If checked, every time a player dies a global message will be displayed in the chat\nAnnounceDeath=@@INI_AnnounceDeath@@\n\n# If checked, every time an animal dies a global message will be displayed in the chat\nAnnounceAnimalDeath=@@INI_AnnounceAnimalDeath@@\n\n# Loaded parts of the map are saved after this set number of real-world minutes have passed. (The map is usually saved only after clients leave a loaded area) Min: 0 Max: 2147483647 Default: 0\nSaveWorldEveryMinutes=@@INI_SaveWorldEveryMinutes@@\n\n# Both admins and players can claim safehouses\nPlayerSafehouse=@@INI_PlayerSafehouse@@\n\n# Only admins can claim safehouses\nAdminSafehouse=@@INI_AdminSafehouse@@\n\n# Allow non-members to enter a safehouse without being invited\nSafehouseAllowTrepass=@@INI_SafehouseAllowTrepass@@\n\n# Allow fire to damage safehouses\nSafehouseAllowFire=@@INI_SafehouseAllowFire@@\n\n# Allow non-members to take items from safehouses\nSafehouseAllowLoot=@@INI_SafehouseAllowLoot@@\n\n# Players will respawn in a safehouse that they were a member of before they died\nSafehouseAllowRespawn=@@INI_SafehouseAllowRespawn@@\n\n# Players must have survived this number of in-game days before they are allowed to claim a safehouse Min: 0 Max: 2147483647 Default: 0\nSafehouseDaySurvivedToClaim=@@INI_SafehouseDaySurvivedToClaim@@\n\n# Players are automatically removed from a safehouse they have not visited for this many real-world hours Min: 0 Max: 2147483647 Default: 144\nSafeHouseRemovalTime=@@INI_SafeHouseRemovalTime@@\n\n# Governs whether players can claim non-residential buildings.\nSafehouseAllowNonResidential=@@INI_SafehouseAllowNonResidential@@\n\nSafehouseDisableDisguises=@@INI_SafehouseDisableDisguises@@\n\n# Min: 0 Max: 2147483647 Default: 20000\nMaxSafezoneSize=@@INI_MaxSafezoneSize@@\n\n# Allow players to destroy world objects with sledgehammers\nAllowDestructionBySledgehammer=@@INI_AllowDestructionBySledgehammer@@\n\n# Allow players to destroy world objects only in their safehouse (require AllowDestructionBySledgehammer to true).\nSledgehammerOnlyInSafehouse=@@INI_SledgehammerOnlyInSafehouse@@\n\nWar=@@INI_War@@\n\n# Time in seconds before the war starts. Min: 60 Max: 2147483647 Default: 600\nWarStartDelay=@@INI_WarStartDelay@@\n\n# War duration in seconds. Min: 60 Max: 2147483647 Default: 3600\nWarDuration=@@INI_WarDuration@@\n\n# Safehouse hit points limit. Min: 0 Max: 2147483647 Default: 3\nWarSafehouseHitPoints=@@INI_WarSafehouseHitPoints@@\n\n# ServerPlayerID determines if a character is from another server, or single player. This value may be changed by soft resets. If this number does match the client, the client must create a new character. This is used in conjunction with ResetID. It is strongly advised that you backup these IDs somewhere\nServerPlayerID=@@INI_ServerPlayerID@@\n\n# The port for the RCON (Remote Console) Min: 0 Max: 65535 Default: 27015\nRCONPort=@@INI_RCONPort@@\n\n# RCON password (Pick a strong password)\nRCONPassword=@@INI_RCONPassword@@\n\n# Enables global text chat integration with a Discord channel\nDiscordEnable=@@INI_DiscordEnable@@\n\n# Discord bot access token\nDiscordToken=@@INI_DiscordToken@@\n\n# The Discord chat channel name\nDiscordChatChannel=@@INI_DiscordChatChannel@@\n\n# The Discord logs channel name\nDiscordLogChannel=@@INI_DiscordLogChannel@@\n\n# The Discord commands channel name\nDiscordCommandChannel=@@INI_DiscordCommandChannel@@\n\n# The Slack incoming webhook URL\nWebhookAddress=@@INI_WebhookAddress@@\n\n# Clients must know this password to join the server. (Ignored when hosting a server via the Host button)\nPassword=@@INI_Password@@\n\n# Limits the number of different accounts a single Steam user may create on this server. Ignored when using the Hosts button. Min: 0 Max: 2147483647 Default: 0\nMaxAccountsPerUser=@@INI_MaxAccountsPerUser@@\n\n# Allow co-op/splitscreen players\nAllowCoop=@@INI_AllowCoop@@\n\n# Players are allowed to sleep when their survivor becomes tired, but they do not NEED to sleep\nSleepAllowed=@@INI_SleepAllowed@@\n\n# Players get tired and need to sleep. (Ignored if SleepAllowed=false)\nSleepNeeded=@@INI_SleepNeeded@@\n\n# WIP: Activating this setting may cause visual desynchronization of player positions.\nKnockedDownAllowed=@@INI_KnockedDownAllowed@@\n\nSneakModeHideFromOtherPlayers=@@INI_SneakModeHideFromOtherPlayers@@\n\nUltraSpeedDoesnotAffectToAnimals=@@INI_UltraSpeedDoesnotAffectToAnimals@@\n\n# List Workshop Mod IDs for the server to download. Each must be separated by a semicolon. Example: WorkshopItems=514427485;513111049\nWorkshopItems=@@INI_WorkshopItems@@\n\n# Show Steam usernames and avatars in the Players list.\nSteamScoreboard=@@INI_SteamScoreboard@@\n\n# Enable the Steam VAC system\nSteamVAC=@@INI_SteamVAC@@\n\n# Attempt to configure a UPnP-enabled internet gateway to automatically setup port forwarding rules. The server will fall back to default ports if this fails\nUPnP=@@INI_UPnP@@\n\n# VOIP is enabled when checked\nVoiceEnable=@@INI_VoiceEnable@@\n\n# The minimum tile distance over which VOIP sounds can be heard. Min: 0.00 Max: 100000.00 Default: 10.00\nVoiceMinDistance=@@INI_VoiceMinDistance@@\n\n# The maximum tile distance over which VOIP sounds can be heard. Min: 0.00 Max: 100000.00 Default: 100.00\nVoiceMaxDistance=@@INI_VoiceMaxDistance@@\n\n# Toggle directional audio for VOIP\nVoice3D=@@INI_Voice3D@@\n\n# Min: 10.00 Max: 150.00 Default: 70.00\nSpeedLimit=@@INI_SpeedLimit@@\n\nLoginQueueEnabled=@@INI_LoginQueueEnabled@@\n\n# Min: 20 Max: 1200 Default: 60\nLoginQueueConnectTimeout=@@INI_LoginQueueConnectTimeout@@\n\n# Set the IP from which the server is broadcast. This is for network configurations with multiple IP addresses, such as server farms\nserver_browser_announced_ip=@@INI_server_browser_announced_ip@@\n\n# Players can respawn in-game at the coordinates where they died\nPlayerRespawnWithSelf=@@INI_PlayerRespawnWithSelf@@\n\n# Players can respawn in-game at a split screen / Remote Play player's location\nPlayerRespawnWithOther=@@INI_PlayerRespawnWithOther@@\n\n# Governs how fast time passes while players sleep. Value multiplies the speed of the time that passes during sleeping. Min: 1.00 Max: 100.00 Default: 40.00\nFastForwardMultiplier=@@INI_FastForwardMultiplier@@\n\n# Safehouse acts like a normal house if an owner of the safehouse is connected (so secure when the owner is offline)\nDisableSafehouseWhenOwnerConnected=@@INI_DisableSafehouseWhenOwnerConnected@@\n\n# Players can create factions when true\nFaction=@@INI_Faction@@\n\n# Players must survive this number of in-game days before being allowed to create a faction Min: 0 Max: 2147483647 Default: 0\nFactionDaySurvivedToCreate=@@INI_FactionDaySurvivedToCreate@@\n\n# Number of players required as faction members before the faction owner can create a group tag Min: 1 Max: 2147483647 Default: 1\nFactionPlayersRequiredForTag=@@INI_FactionPlayersRequiredForTag@@\n\n# Disables radio transmissions from players with an access level\nDisableRadioStaff=@@INI_DisableRadioStaff@@\n\n# Disables radio transmissions from players with 'admin' access level\nDisableRadioAdmin=@@INI_DisableRadioAdmin@@\n\n# Disables radio transmissions from players with 'gm' access level\nDisableRadioGM=@@INI_DisableRadioGM@@\n\n# Disables radio transmissions from players with 'overseer' access level\nDisableRadioOverseer=@@INI_DisableRadioOverseer@@\n\n# Disables radio transmissions from players with 'moderator' access level\nDisableRadioModerator=@@INI_DisableRadioModerator@@\n\n# Disables radio transmissions from invisible players\nDisableRadioInvisible=@@INI_DisableRadioInvisible@@\n\n# Semicolon-separated list of commands that will not be written to the cmd.txt server log. For example:  -vehicle. Inputting * means do NOT write any vehicle command. Inputting:  +vehicle.installPart means DO write that command\nClientCommandFilter=@@INI_ClientCommandFilter@@\n\n# Semicolon-separated list of actions that will be written to the ClientActionLogs.txt server log.\nClientActionLogs=@@INI_ClientActionLogs@@\n\n# Track changes in player perk levels in PerkLog.txt server log\nPerkLogs=@@INI_PerkLogs@@\n\n# Maximum number of items that can be placed in a container.  Zero means there is no limit. (PLEASE NOTE: This includes individual small items such as nails. A limit of 50 will mean only 50 nails can be stored.) Min: 0 Max: 9000 Default: 0\nItemNumbersLimitPerContainer=@@INI_ItemNumbersLimitPerContainer@@\n\n# Number of days before old blood splats are removed.\n# Removal happens when map chunks are loaded.\n# Zero means they will never disappear Min: 0 Max: 365 Default: 0\nBloodSplatLifespanDays=@@INI_BloodSplatLifespanDays@@\n\n# Allow use of non-ASCII (cyrillic etc) characters in usernames\nAllowNonAsciiUsername=@@INI_AllowNonAsciiUsername@@\n\nBanKickGlobalSound=@@INI_BanKickGlobalSound@@\n\n# If enabled, when HoursForCorpseRemoval triggers, it will also remove player's corpses from the ground.\nRemovePlayerCorpsesOnCorpseRemoval=@@INI_RemovePlayerCorpsesOnCorpseRemoval@@\n\n# If true, player can use the \"delete all\" button on bins.\nTrashDeleteAll=@@INI_TrashDeleteAll@@\n\n# If true, player can hit again when struck by another player.\nPVPMeleeWhileHitReaction=@@INI_PVPMeleeWhileHitReaction@@\n\n# If true, players will have to mouse over someone to see their display name.\nMouseOverToSeeDisplayName=@@INI_MouseOverToSeeDisplayName@@\n\n# If true, automatically hide the player you can't see (like zombies).\nHidePlayersBehindYou=@@INI_HidePlayersBehindYou@@\n\n# Damage multiplier for PVP melee attacks. Min: 0.00 Max: 500.00 Default: 30.00\nPVPMeleeDamageModifier=@@INI_PVPMeleeDamageModifier@@\n\n# Damage multiplier for PVP ranged attacks. Min: 0.00 Max: 500.00 Default: 50.00\nPVPFirearmDamageModifier=@@INI_PVPFirearmDamageModifier@@\n\n# Modify the range of zombie attraction to cars. (Lower values can help with lag.) Min: 0.00 Max: 10.00 Default: 0.50\nCarEngineAttractionModifier=@@INI_CarEngineAttractionModifier@@\n\n# Governs whether players bump (and knock over) other players when running through them.\nPlayerBumpPlayer=@@INI_PlayerBumpPlayer@@\n\n# Controls display of remote players on the in-game map. 1=Hidden 2=Friends 3=Friends and nearby players 4=Everyone Min: 1 Max: 4 Default: 1\nMapRemotePlayerVisibility=@@INI_MapRemotePlayerVisibility@@\n\n# Min: 1 Max: 300 Default: 5\nBackupsCount=@@INI_BackupsCount@@\n\nBackupsOnStart=@@INI_BackupsOnStart@@\n\nBackupsOnVersionChange=@@INI_BackupsOnVersionChange@@\n\n# Min: 0 Max: 1500 Default: 0\nBackupsPeriod=@@INI_BackupsPeriod@@\n\n# Disables vehicle towing\nDisableVehicleTowing=@@INI_DisableVehicleTowing@@\n\n# Disables trailer towing\nDisableTrailerTowing=@@INI_DisableTrailerTowing@@\n\n# Disables burnt vehicle towing\nDisableBurntTowing=@@INI_DisableBurntTowing@@\n\n# Path to the file with the list of words to be prohibited. Each word must be on a separate line\nBadWordListFile=@@INI_BadWordListFile@@\n\n# Path to the file with the list of words that should be allowed, even if they contain bad word. Each word should be on a separate line.\nGoodWordListFile=@@INI_GoodWordListFile@@\n\n# What to do with the sender of a bad word in the chat: 1 - ban, 2 - kick, 3 - record the violation in the database, 4 - mute\nBadWordPolicy=@@INI_BadWordPolicy@@\n\n# The symbol or piece of text that will replace the bad word\nBadWordReplacement=@@INI_BadWordReplacement@@\n\n# Disables safety system anti-cheat protection.\nAntiCheatSafety=@@INI_AntiCheatSafety@@\n\n# Disables character speed anti-cheat protection.\nAntiCheatSpeed=@@INI_AntiCheatSpeed@@\n\n# Disables character no-clipping anti-cheat protection.\nAntiCheatNoClip=@@INI_AntiCheatNoClip@@\n\n# Disables character hit anti-cheat protection.\nAntiCheatHit=@@INI_AntiCheatHit@@\n\n# Disables packet exception checks anti-cheat protection.\nAntiCheatPacketException=@@INI_AntiCheatPacketException@@\n\n# Disables player permissions anti-cheat protection.\nAntiCheatPermission=@@INI_AntiCheatPermission@@\n\n# Disables player XP anti-cheat protection.\nAntiCheatXP=@@INI_AntiCheatXP@@\n\n# Disables safehouse anti-cheat protection.\nAntiCheatSafeHouse=@@INI_AntiCheatSafeHouse@@\n\n# Disables player anti-cheat protection.\nAntiCheatPlayer=@@INI_AntiCheatPlayer@@\n\n# Disables checksum anti-cheat protection.\nAntiCheatChecksum=@@INI_AntiCheatChecksum@@\n\n# Sets the multiplayer update period in seconds. Statistics is disabled if value is 0. Min: 0 Max: 10 Default: 1\nMultiplayerStatisticsPeriod=@@INI_MultiplayerStatisticsPeriod@@\n\n# Disables scoreboard.\nDisableScoreboard=@@INI_DisableScoreboard@@\n\n# Hides admins in the player list.\nHideAdminsInPlayerList=@@INI_HideAdminsInPlayerList@@\n\n# Sets the limit for processing network packets from each client on the server. Min: 100 Max: 1000 Default: 300\nMaxPacketsPerSecond=@@INI_MaxPacketsPerSecond@@\n\n# Shows player character coordinates in the lower right corner.\nShowCoordinates=@@INI_ShowCoordinates@@\n\n# The worldgen seed used to generate the world.\n# If you want to change this, put a new value in and delete map_worldgen.bin in your save directory.\nSeed=@@INI_Seed@@\n\nUsePhysicsHitReaction=@@INI_UsePhysicsHitReaction@@\n\n# Min: 64 Max: 1024 Default: 200\nChatMessageCharacterLimit=@@INI_ChatMessageCharacterLimit@@\n\n# Min: 1 Max: 30 Default: 3\nChatMessageSlowModeTime=@@INI_ChatMessageSlowModeTime@@","luaTemplate":"SandboxVars = {\n    VERSION = 6,\n    -- Changing this also sets the \"Population Multiplier\" in Advanced Zombie Options. Default = Normal\n    -- 1 = Insane\n    -- 2 = Very High\n    -- 3 = High\n    -- 4 = Normal\n    -- 5 = Low\n    -- 6 = None\n    Zombies = @@LUA_Zombies@@,\n    -- How zombies are distributed across the map. Default = Urban Focused\n    -- 1 = Urban Focused\n    -- 2 = Uniform\n    Distribution = @@LUA_Distribution@@,\n    -- Controls whether some randomization is applied to zombie distribution.\n    ZombieVoronoiNoise = @@LUA_ZombieVoronoiNoise@@,\n    -- How frequently new zombies are added to the world. Default = None\n    -- 1 = High\n    -- 2 = Normal\n    -- 3 = Low\n    -- 4 = None\n    ZombieRespawn = @@LUA_ZombieRespawn@@,\n    -- Zombie allowed to migrate to empty cells.\n    ZombieMigrate = @@LUA_ZombieMigrate@@,\n    -- Default = 1 Hour, 30 Minutes\n    -- 1 = 15 Minutes\n    -- 2 = 30 Minutes\n    -- 3 = 1 Hour\n    -- 4 = 1 Hour, 30 Minutes\n    -- 5 = 2 Hours\n    -- 6 = 3 Hours\n    -- 7 = 4 Hours\n    -- 8 = 5 Hours\n    -- 9 = 6 Hours\n    -- 10 = 7 Hours\n    -- 11 = 8 Hours\n    -- 12 = 9 Hours\n    -- 13 = 10 Hours\n    -- 14 = 11 Hours\n    -- 15 = 12 Hours\n    -- 16 = 13 Hours\n    -- 17 = 14 Hours\n    -- 18 = 15 Hours\n    -- 19 = 16 Hours\n    -- 20 = 17 Hours\n    -- 21 = 18 Hours\n    -- 22 = 19 Hours\n    -- 23 = 20 Hours\n    -- 24 = 21 Hours\n    -- 25 = 22 Hours\n    -- 26 = 23 Hours\n    -- 27 = Real-time\n    DayLength = @@LUA_DayLength@@,\n    StartYear = @@LUA_StartYear@@,\n    -- Month in which the game starts. Default = July\n    -- 1 = January\n    -- 2 = February\n    -- 3 = March\n    -- 4 = April\n    -- 5 = May\n    -- 6 = June\n    -- 7 = July\n    -- 8 = August\n    -- 9 = September\n    -- 10 = October\n    -- 11 = November\n    -- 12 = December\n    StartMonth = @@LUA_StartMonth@@,\n    -- Day of the month in which the games starts.\n    StartDay = @@LUA_StartDay@@,\n    -- Hour of the day in which the game starts. Default = 9 AM\n    -- 1 = 7 AM\n    -- 2 = 9 AM\n    -- 3 = 12 PM\n    -- 4 = 2 PM\n    -- 5 = 5 PM\n    -- 6 = 9 PM\n    -- 7 = 12 AM\n    -- 8 = 2 AM\n    -- 9 = 5 AM\n    StartTime = @@LUA_StartTime@@,\n    -- Whether the time of day changes naturally, or it's always day/night. Default = Normal\n    -- 1 = Normal\n    -- 2 = Endless Day\n    -- 3 = Endless Night\n    DayNightCycle = @@LUA_DayNightCycle@@,\n    -- Whether weather changes or remains at a single state. Default = Normal\n    -- 1 = Normal\n    -- 2 = No Weather\n    -- 3 = Endless Rain\n    -- 4 = Endless Storm\n    -- 5 = Endless Snow\n    -- 6 = Endless Blizzard\n    ClimateCycle = @@LUA_ClimateCycle@@,\n    -- Whether fog occurs naturally, never occurs, or is always present. Default = Normal\n    -- 1 = Normal\n    -- 2 = No Fog\n    -- 3 = Endless Fog\n    FogCycle = @@LUA_FogCycle@@,\n    -- How long after the default start date (July 9, 1993) that plumbing fixtures (eg. sinks) stop being infinite sources of water. Default = 0 - 30 Days\n    -- 1 = Instant\n    -- 2 = 0 - 30 Days\n    -- 3 = 0 - 2 Months\n    -- 4 = 0 - 6 Months\n    -- 5 = 0 - 1 Year\n    -- 6 = 0 - 5 Years\n    -- 7 = 2 - 6 Months\n    -- 8 = 6 - 12 Months\n    -- 9 = Disabled\n    WaterShut = @@LUA_WaterShut@@,\n    -- How long after the default start date (July 9, 1993) that the world's electricity turns off for good. Default = 14 - 30 Days\n    -- 1 = Instant\n    -- 2 = 14 - 30 Days\n    -- 3 = 14 Days - 2 Months\n    -- 4 = 14 Days - 6 Months\n    -- 5 = 14 Days - 1 Year\n    -- 6 = 14 Days - 5 Years\n    -- 7 = 2 - 6 Months\n    -- 8 = 6 - 12 Months\n    -- 9 = Disabled\n    ElecShut = @@LUA_ElecShut@@,\n    -- How long alarm batteries can last for after the power shuts off. Default = 0 - 30 Days\n    -- 1 = Instant\n    -- 2 = 0 - 30 Days\n    -- 3 = 0 - 2 Months\n    -- 4 = 0 - 6 Months\n    -- 5 = 0 - 1 Year\n    -- 6 = 0 - 5 Years\n    AlarmDecay = @@LUA_AlarmDecay@@,\n    -- How long after the default start date (July 9, 1993) that plumbing fixtures (eg. sinks) stop being infinite sources of water. Min: -1 Max: 2147483647 Default: 14\n    WaterShutModifier = @@LUA_WaterShutModifier@@,\n    -- How long after the default start date (July 9, 1993) that the world's electricity turns off for good. Min: -1 Max: 2147483647 Default: 14\n    ElecShutModifier = @@LUA_ElecShutModifier@@,\n    -- How long alarm batteries can last for after the power shuts off. Min: -1 Max: 2147483647 Default: 14\n    AlarmDecayModifier = @@LUA_AlarmDecayModifier@@,\n    -- Any food that can rot or spoil. Min: 0.00 Max: 4.00 Default: 0.80\n    FoodLootNew = @@LUA_FoodLootNew@@,\n    -- All other items that can be read, including books, fliers, and newspapers. Min: 0.00 Max: 4.00 Default: 0.60\n    LiteratureLootNew = @@LUA_LiteratureLootNew@@,\n    -- Books that provide skill XP multipliers. Min: 0.00 Max: 4.00 Default: 0.60\n    SkillBookLoot = @@LUA_SkillBookLoot@@,\n    -- Items that teach recipes. Min: 0.00 Max: 4.00 Default: 0.60\n    RecipeResourceLoot = @@LUA_RecipeResourceLoot@@,\n    -- Medicine, bandages and first aid tools. Min: 0.00 Max: 4.00 Default: 0.60\n    MedicalLootNew = @@LUA_MedicalLootNew@@,\n    -- Fishing Rods, Tents, camping gear etc. Min: 0.00 Max: 4.00 Default: 0.60\n    SurvivalGearsLootNew = @@LUA_SurvivalGearsLootNew@@,\n    -- Canned and dried food, beverages. Min: 0.00 Max: 4.00 Default: 0.60\n    CannedFoodLootNew = @@LUA_CannedFoodLootNew@@,\n    -- Weapons that are not tools in other categories. Min: 0.00 Max: 4.00 Default: 0.60\n    WeaponLootNew = @@LUA_WeaponLootNew@@,\n    -- Also includes weapon attachments. Min: 0.00 Max: 4.00 Default: 1.20\n    RangedWeaponLootNew = @@LUA_RangedWeaponLootNew@@,\n    -- Loose ammo, boxes and magazines. Min: 0.00 Max: 4.00 Default: 0.60\n    AmmoLootNew = @@LUA_AmmoLootNew@@,\n    -- Vehicle parts and the tools needed to install them. Min: 0.00 Max: 4.00 Default: 0.60\n    MechanicsLootNew = @@LUA_MechanicsLootNew@@,\n    -- Everything else. Also affects foraging for all items in Town/Road zones. Min: 0.00 Max: 4.00 Default: 0.80\n    OtherLootNew = @@LUA_OtherLootNew@@,\n    -- All wearable items that are not containers. Min: 0.00 Max: 4.00 Default: 0.60\n    ClothingLootNew = @@LUA_ClothingLootNew@@,\n    -- Backpacks and other wearable/equippable containers, eg. cases. Min: 0.00 Max: 4.00 Default: 0.60\n    ContainerLootNew = @@LUA_ContainerLootNew@@,\n    -- Keys for buildings/cars, key rings, and locks. Min: 0.00 Max: 4.00 Default: 0.40\n    KeyLootNew = @@LUA_KeyLootNew@@,\n    -- VHS tapes and CDs. Min: 0.00 Max: 4.00 Default: 0.60\n    MediaLootNew = @@LUA_MediaLootNew@@,\n    -- Spiffo items, plushies, and other collectible keepsake items eg. Photos. Min: 0.00 Max: 4.00 Default: 0.60\n    MementoLootNew = @@LUA_MementoLootNew@@,\n    -- Items that are used in cooking, including those (eg. knives) which can be weapons. Does not include food. Includes both usable and unusable items. Min: 0.00 Max: 4.00 Default: 0.60\n    CookwareLootNew = @@LUA_CookwareLootNew@@,\n    -- Items and weapons that are used as ingredients for crafting or building. This is a general category that does not include items belonging to other categories such as Cookware or Medical. Does not include Tools. Min: 0.00 Max: 4.00 Default: 0.60\n    MaterialLootNew = @@LUA_MaterialLootNew@@,\n    -- Items and weapons which are used in both animal and plant agriculture, such as Seeds, Trowels, or Shovels. Min: 0.00 Max: 4.00 Default: 0.60\n    FarmingLootNew = @@LUA_FarmingLootNew@@,\n    -- Items and weapons which are Tools but don't fit in other categories such as Mechanics or Farming. Min: 0.00 Max: 4.00 Default: 0.60\n    ToolLootNew = @@LUA_ToolLootNew@@,\n    -- <BHC> [!] It is recommended that you DO NOT change this. [!] <RGB:1,1,1>   Can be used to adjust the number of rolls made on loot tables when spawning loot. Will not reduce the number of rolls below 1. Can negatively affect performance if set to high values. It is highly recommended that this not be changed. Min: 0.10 Max: 100.00 Default: 1.00\n    RollsMultiplier = @@LUA_RollsMultiplier@@,\n    -- A comma-separated list of item types that won't spawn as ordinary loot.\n    LootItemRemovalList = \"@@LUA_LootItemRemovalList@@\",\n    -- If enabled, items on the Loot Item Removal List, or that have their rarity set to 'None', will not spawn in randomised world stories.\n    RemoveStoryLoot = @@LUA_RemoveStoryLoot@@,\n    -- If enabled, items on the Loot Item Removal List, or that have their rarity set to 'None', will not spawn worn by, or attached to, zombies.\n    RemoveZombieLoot = @@LUA_RemoveZombieLoot@@,\n    -- If greater than 0, the spawn of loot is increased relative to the number of nearby zombies,  with the effect multiplied by this number. Min: 0 Max: 20 Default: 0\n    ZombiePopLootEffect = @@LUA_ZombiePopLootEffect@@,\n    -- Min: 0.00 Max: 0.20 Default: 0.05\n    InsaneLootFactor = @@LUA_InsaneLootFactor@@,\n    -- Min: 0.05 Max: 0.60 Default: 0.20\n    ExtremeLootFactor = @@LUA_ExtremeLootFactor@@,\n    -- Min: 0.20 Max: 1.00 Default: 0.60\n    RareLootFactor = @@LUA_RareLootFactor@@,\n    -- Min: 0.60 Max: 2.00 Default: 1.00\n    NormalLootFactor = @@LUA_NormalLootFactor@@,\n    -- Min: 1.00 Max: 3.00 Default: 2.00\n    CommonLootFactor = @@LUA_CommonLootFactor@@,\n    -- Min: 2.00 Max: 4.00 Default: 3.00\n    AbundantLootFactor = @@LUA_AbundantLootFactor@@,\n    -- The global temperature. Default = Normal\n    -- 1 = Very Cold\n    -- 2 = Cold\n    -- 3 = Normal\n    -- 4 = Hot\n    -- 5 = Very Hot\n    Temperature = @@LUA_Temperature@@,\n    -- How often it rains. Default = Normal\n    -- 1 = Very Dry\n    -- 2 = Dry\n    -- 3 = Normal\n    -- 4 = Rainy\n    -- 5 = Very Rainy\n    Rain = @@LUA_Rain@@,\n    -- Number of days until the erosion system (which adds vines, long grass, new trees etc. to the world) will reach 100% growth. Default = Slow (200 Days)\n    -- 1 = Very Fast (20 Days)\n    -- 2 = Fast (50 Days)\n    -- 3 = Normal (100 Days)\n    -- 4 = Slow (200 Days)\n    -- 5 = Very Slow (500 Days)\n    ErosionSpeed = @@LUA_ErosionSpeed@@,\n    -- For a custom Erosion Speed. Zero means use the Erosion Speed option. Maximum is 36,500 days (approximately 100 years). Min: -1 Max: 36500 Default: 0\n    ErosionDays = @@LUA_ErosionDays@@,\n    -- The speed of plant growth. Default = Normal\n    -- 1 = Very Fast\n    -- 2 = Fast\n    -- 3 = Normal\n    -- 4 = Slow\n    -- 5 = Very Slow\n    Farming = @@LUA_Farming@@,\n    -- How long it takes for food to break down in a composter. Default = 2 Weeks\n    -- 1 = 1 Week\n    -- 2 = 2 Weeks\n    -- 3 = 3 Weeks\n    -- 4 = 4 Weeks\n    -- 5 = 6 Weeks\n    -- 6 = 8 Weeks\n    -- 7 = 10 Weeks\n    -- 8 = 12 Weeks\n    CompostTime = @@LUA_CompostTime@@,\n    -- How fast the player's hunger, thirst, and fatigue will decrease. Default = Normal\n    -- 1 = Very Fast\n    -- 2 = Fast\n    -- 3 = Normal\n    -- 4 = Slow\n    -- 5 = Very Slow\n    StatsDecrease = @@LUA_StatsDecrease@@,\n    -- The abundance of items found in Foraging mode. Default = Normal\n    -- 1 = Very Poor\n    -- 2 = Poor\n    -- 3 = Normal\n    -- 4 = Abundant\n    -- 5 = Very Abundant\n    NatureAbundance = @@LUA_NatureAbundance@@,\n    -- How likely the player is to activate a house alarm when breaking into a new house. Default = Sometimes\n    -- 1 = Never\n    -- 2 = Extremely Rare\n    -- 3 = Rare\n    -- 4 = Sometimes\n    -- 5 = Often\n    -- 6 = Very Often\n    Alarm = @@LUA_Alarm@@,\n    -- How frequently the doors of homes and buildings will be locked when discovered. Default = Very Often\n    -- 1 = Never\n    -- 2 = Extremely Rare\n    -- 3 = Rare\n    -- 4 = Sometimes\n    -- 5 = Often\n    -- 6 = Very Often\n    LockedHouses = @@LUA_LockedHouses@@,\n    -- Spawn with Chips, a Water Bottle, a Small Backpack, a Baseball Bat, and a Hammer.\n    StarterKit = @@LUA_StarterKit@@,\n    -- Nutritional value of food affects the player's condition. Turning this off will stop the player gaining or losing weight.\n    Nutrition = @@LUA_Nutrition@@,\n    -- How fast that food will spoil, inside or outside of a fridge. Default = Normal\n    -- 1 = Very Fast\n    -- 2 = Fast\n    -- 3 = Normal\n    -- 4 = Slow\n    -- 5 = Very Slow\n    FoodRotSpeed = @@LUA_FoodRotSpeed@@,\n    -- How effective a fridge will be at keeping food fresh for longer. Default = Normal\n    -- 1 = Very Low\n    -- 2 = Low\n    -- 3 = Normal\n    -- 4 = High\n    -- 5 = Very High\n    -- 6 = No decay\n    FridgeFactor = @@LUA_FridgeFactor@@,\n    -- When greater than 0, loot will not respawn in zones that have been visited within this number of in-game hours. Min: 0 Max: 2147483647 Default: 0\n    SeenHoursPreventLootRespawn = @@LUA_SeenHoursPreventLootRespawn@@,\n    -- When greater than 0, after X hours, all containers in towns and trailer parks in the world will respawn loot. To spawn loot a container must have been looted at least once. Loot respawn is not impacted by visibility or subsequent looting. Min: 0 Max: 2147483647 Default: 0\n    HoursForLootRespawn = @@LUA_HoursForLootRespawn@@,\n    -- Containers with a number of items greater, or equal to, this setting will not respawn. Min: 0 Max: 2147483647 Default: 5\n    MaxItemsForLootRespawn = @@LUA_MaxItemsForLootRespawn@@,\n    -- Items will not respawn in buildings that players have barricaded or built in.\n    ConstructionPreventsLootRespawn = @@LUA_ConstructionPreventsLootRespawn@@,\n    -- A comma-separated list of item types that will be removed after HoursForWorldItemRemoval hours.\n    WorldItemRemovalList = \"@@LUA_WorldItemRemovalList@@\",\n    -- Number of hours since an item was dropped on the ground before it is removed.  Items are removed the next time that part of the map is loaded.   Zero means items are not removed. Min: 0.00 Max: 2147483647.00 Default: 24.00\n    HoursForWorldItemRemoval = @@LUA_HoursForWorldItemRemoval@@,\n    -- If true, any items *not* in WorldItemRemovalList will be removed.\n    ItemRemovalListBlacklistToggle = @@LUA_ItemRemovalListBlacklistToggle@@,\n    -- How long after the end of the world to begin. This will affect starting world erosion and food spoilage. Does not affect the starting date. Default = 0\n    -- 1 = 0\n    -- 2 = 1\n    -- 3 = 2\n    -- 4 = 3\n    -- 5 = 4\n    -- 6 = 5\n    -- 7 = 6\n    -- 8 = 7\n    -- 9 = 8\n    -- 10 = 9\n    -- 11 = 10\n    -- 12 = 11\n    -- 13 = 12\n    TimeSinceApo = @@LUA_TimeSinceApo@@,\n    -- How much water plants will lose per day, and their ability to avoid disease. Default = Normal\n    -- 1 = Very High\n    -- 2 = High\n    -- 3 = Normal\n    -- 4 = Low\n    -- 5 = Very Low\n    PlantResilience = @@LUA_PlantResilience@@,\n    -- The yield of plants when harvested. Default = Normal\n    -- 1 = Very Poor\n    -- 2 = Poor\n    -- 3 = Normal\n    -- 4 = Abundant\n    -- 5 = Very Abundant\n    PlantAbundance = @@LUA_PlantAbundance@@,\n    -- Recovery from being tired after performing actions. Default = Normal\n    -- 1 = Very Fast\n    -- 2 = Fast\n    -- 3 = Normal\n    -- 4 = Slow\n    -- 5 = Very Slow\n    EndRegen = @@LUA_EndRegen@@,\n    -- How regularly a helicopter passes over the Event Zone. Default = Once\n    -- 1 = Never\n    -- 2 = Once\n    -- 3 = Sometimes\n    -- 4 = Often\n    Helicopter = @@LUA_Helicopter@@,\n    -- How often zombie-attracting metagame events like distant gunshots will occur. Default = Sometimes\n    -- 1 = Never\n    -- 2 = Sometimes\n    -- 3 = Often\n    MetaEvent = @@LUA_MetaEvent@@,\n    -- How often events during the player's sleep, like nightmares, occur. Default = Never\n    -- 1 = Never\n    -- 2 = Sometimes\n    -- 3 = Often\n    SleepingEvent = @@LUA_SleepingEvent@@,\n    -- How much fuel is consumed by generators per in-game hour. Min: 0.00 Max: 100.00 Default: 0.10\n    GeneratorFuelConsumption = @@LUA_GeneratorFuelConsumption@@,\n    -- The chance of electrical generators spawning on the map. Default = Rare\n    -- 1 = None (not recommended)\n    -- 2 = Insanely Rare\n    -- 3 = Extremely Rare\n    -- 4 = Rare\n    -- 5 = Normal\n    -- 6 = Common\n    -- 7 = Abundant\n    GeneratorSpawning = @@LUA_GeneratorSpawning@@,\n    -- How often a looted map will have notes on it, written by a deceased survivor. Default = Sometimes\n    -- 1 = Never\n    -- 2 = Extremely Rare\n    -- 3 = Rare\n    -- 4 = Sometimes\n    -- 5 = Often\n    -- 6 = Very Often\n    AnnotatedMapChance = @@LUA_AnnotatedMapChance@@,\n    -- Adds free points during character creation. Min: -100 Max: 100 Default: 0\n    CharacterFreePoints = @@LUA_CharacterFreePoints@@,\n    -- Gives player-built constructions extra hit points so they are  more resistant to zombie damage. Default = Normal\n    -- 1 = Very Low\n    -- 2 = Low\n    -- 3 = Normal\n    -- 4 = High\n    -- 5 = Very High\n    ConstructionBonusPoints = @@LUA_ConstructionBonusPoints@@,\n    -- The level of ambient lighting at night. Default = Normal\n    -- 1 = Pitch Black\n    -- 2 = Dark\n    -- 3 = Normal\n    -- 4 = Bright\n    NightDarkness = @@LUA_NightDarkness@@,\n    -- The time from dusk to dawn. Default = Normal\n    -- 1 = Always Night\n    -- 2 = Long\n    -- 3 = Normal\n    -- 4 = Short\n    -- 5 = Always Day\n    NightLength = @@LUA_NightLength@@,\n    -- If survivors can get broken limbs from impacts, zombie damage, falls etc.\n    BoneFracture = @@LUA_BoneFracture@@,\n    -- The impact that injuries have on your body, and their healing time. Default = Normal\n    -- 1 = Low\n    -- 2 = Normal\n    -- 3 = High\n    InjurySeverity = @@LUA_InjurySeverity@@,\n    -- How long, in hours, before dead zombie bodies disappear from the world.  If 0, maggots will not spawn on corpses. Min: -1.00 Max: 2147483647.00 Default: 216.00\n    HoursForCorpseRemoval = @@LUA_HoursForCorpseRemoval@@,\n    -- The impact that nearby decaying bodies has on the player's health and emotions. Default = Normal\n    -- 1 = None\n    -- 2 = Low\n    -- 3 = Normal\n    -- 4 = High\n    -- 5 = Insane\n    DecayingCorpseHealthImpact = @@LUA_DecayingCorpseHealthImpact@@,\n    -- Whether nearby \"living\" zombies have the same impact on the player's health and emotions.\n    ZombieHealthImpact = @@LUA_ZombieHealthImpact@@,\n    -- How much blood is sprayed on floors and walls by injuries. Default = Normal\n    -- 1 = None\n    -- 2 = Low\n    -- 3 = Normal\n    -- 4 = High\n    -- 5 = Ultra Gore\n    BloodLevel = @@LUA_BloodLevel@@,\n    -- How quickly clothing degrades, becomes dirty, and bloodied. Default = Normal\n    -- 1 = Disabled\n    -- 2 = Slow\n    -- 3 = Normal\n    -- 4 = Fast\n    ClothingDegradation = @@LUA_ClothingDegradation@@,\n    -- If fires spread when started.\n    FireSpread = @@LUA_FireSpread@@,\n    -- Number of in-game days before rotten food is removed from the map.  -1 means rotten food is never removed. Min: -1 Max: 2147483647 Default: -1\n    DaysForRottenFoodRemoval = @@LUA_DaysForRottenFoodRemoval@@,\n    -- If enabled, generators will work on exterior tiles.  This will allow, for example, the powering of gas pumps.\n    AllowExteriorGenerator = @@LUA_AllowExteriorGenerator@@,\n    -- Maximum intensity of fog. Default = Normal\n    -- 1 = Normal\n    -- 2 = Moderate\n    -- 3 = Low\n    -- 4 = None\n    MaxFogIntensity = @@LUA_MaxFogIntensity@@,\n    -- Maximum intensity of rain. Default = Normal\n    -- 1 = Normal\n    -- 2 = Moderate\n    -- 3 = Low\n    MaxRainFxIntensity = @@LUA_MaxRainFxIntensity@@,\n    -- If snow will accumulate on the ground.  If disabled, snow will still show on vegetation and rooftops.\n    EnableSnowOnGround = @@LUA_EnableSnowOnGround@@,\n    -- If melee attacking slows you down.\n    AttackBlockMovements = @@LUA_AttackBlockMovements@@,\n    -- The chance of finding randomized buildings on the map (eg. burnt out houses,  on const UNBOUND = 2147483647;

const state = { ini:{}, lua:{} };
const original = { ini:{}, lua:{} };
BUNDLE.iniFields.forEach(f => { state.ini[f.id] = f.value; original.ini[f.id] = f.value; });
BUNDLE.luaFields.forEach(f => { state.lua[f.id] = f.value; original.lua[f.id] = f.value; });

const fieldById = {};
BUNDLE.iniFields.forEach(f => fieldById[f.id] = f);
BUNDLE.luaFields.forEach(f => fieldById[f.id] = f);

let activeTab = 'ini';

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function normalize(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function useSlider(f){
  return (f.max - f.min) <= 2000 && f.max < UNBOUND;
}
function decimalsStep(dec){
  return dec > 0 ? (1 / Math.pow(10, dec)).toFixed(dec) : '1';
}
function fmtNum(v, dec){
  const n = Number(v);
  return isNaN(n) ? v : n.toFixed(dec);
}

function fieldsBySection(kind){
  const sections = kind === 'ini' ? BUNDLE.iniSections : BUNDLE.luaSections;
  const fields = kind === 'ini' ? BUNDLE.iniFields : BUNDLE.luaFields;
  const map = new Map(sections.map(s => [s, []]));
  fields.forEach(f => { if(!map.has(f.section)) map.set(f.section, []); map.get(f.section).push(f); });
  return sections.map(s => ({ section: s, fields: map.get(s) || [] }));
}

function controlHTML(kind, f){
  const val = state[kind][f.id];
  if(f.type === 'toggle'){
    const checked = val === 'true';
    return `<div class="switch-row">
      <label class="switch">
        <input type="checkbox" data-id="${f.id}" data-kind="${kind}" class="ctl-toggle" ${checked?'checked':''}>
        <span class="switch-track"></span>
      </label>
      <span class="switch-state" data-state-for="${f.id}">${checked?'Ativado':'Desativado'}</span>
    </div>`;
  }
  if(f.type === 'select'){
    const opts = f.options.map(o => `<option value="${esc(o.v)}" ${o.v===val?'selected':''}>${esc(o.l)}</option>`).join('');
    return `<select class="ctrl ctl-select" data-id="${f.id}" data-kind="${kind}">${opts}</select>`;
  }
  if(f.type === 'range'){
    const dec = f.decimals || 0;
    const step = decimalsStep(dec);
    const maxLabel = f.max >= UNBOUND ? 'sem limite prático' : fmtNum(f.max, dec);
    if(useSlider(f)){
      return `<div class="range-row">
        <input type="range" class="ctl-range" data-id="${f.id}" data-kind="${kind}" min="${f.min}" max="${f.max}" step="${step}" value="${val}">
        <input type="number" class="num ctl-range-num" data-id="${f.id}" data-kind="${kind}" min="${f.min}" max="${f.max}" step="${step}" value="${val}">
      </div>
      <div class="range-hint">mín. ${fmtNum(f.min,dec)} · máx. ${maxLabel}</div>`;
    }
    return `<div class="range-row">
      <input type="number" class="num ctl-range-num" data-id="${f.id}" data-kind="${kind}" min="${f.min}" max="${f.max}" step="${step}" value="${val}" style="width:140px">
    </div>
    <div class="range-hint">mín. ${fmtNum(f.min,dec)} · máx. ${maxLabel}</div>`;
  }
  if(f.type === 'password'){
    return `<div class="pw-row">
        <input type="password" class="text-ctrl ctl-text" data-id="${f.id}" data-kind="${kind}" value="${esc(val)}" placeholder="deixe em branco para manter a atual" autocomplete="off">
        <button type="button" class="pw-toggle" data-pw-toggle="${f.id}">mostrar</button>
      </div>
      <div class="sensitive-note">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
        <span>Por segurança, o valor atual não fica pré-carregado. Nada digitado aqui sai do seu navegador.</span>
      </div>`;
  }
  return `<input type="text" class="text-ctrl ctl-text" data-id="${f.id}" data-kind="${kind}" value="${esc(val)}">`;
}

function fieldHTML(kind, f){
  const searchBlob = esc(normalize(f.label + ' ' + f.desc + ' ' + f.id));
  return `<div class="field" data-field-id="${f.id}" data-search="${searchBlob}">
    <div class="field-info">
      <div class="field-head">
        <span class="field-label">${esc(f.label)}</span>
        <span class="mod-badge" data-badge-for="${f.id}" hidden>alterado</span>
        <button type="button" class="field-reset" data-reset-for="${f.id}" hidden>restaurar</button>
      </div>
      <p class="field-desc">${esc(f.desc)}</p>
    </div>
    <div class="field-control" data-control-for="${f.id}">${controlHTML(kind, f)}</div>
  </div>`;
}

function sectionId(kind, name){
  return 'sec-' + kind + '-' + normalize(name).replace(/[^a-z0-9]+/g,'-');
}

function renderTab(kind){
  const groups = fieldsBySection(kind);
  const intro = kind === 'ini'
    ? '<p class="content-intro">Configurações de comportamento do servidor: acesso, chat, PVP, safehouses, rede, backups. Mudanças aqui só valem depois de reiniciar o servidor.</p>'
    : '<p class="content-intro">Configurações do mundo e da sobrevivência: zumbis, loot, clima, XP e tudo que vem do SandboxVars. Também só valem depois de reiniciar o servidor.</p>';
  const html = groups.map(g => {
    if(g.fields.length === 0) return '';
    return `<section class="section" id="${sectionId(kind, g.section)}" data-section-name="${esc(normalize(g.section))}">
      <h2>${esc(g.section)}</h2>
      <p class="section-count">${g.fields.length} configuraç${g.fields.length===1?'ão':'ões'}</p>
      <div class="fields-grid">${g.fields.map(f => fieldHTML(kind, f)).join('')}</div>
    </section>`;
  }).join('');
  return intro + html + '<p class="no-results" id="no-results-' + kind + '" hidden>Nenhuma configuração encontrada para essa busca.</p>';
}

function renderNav(kind){
  const groups = fieldsBySection(kind).filter(g => g.fields.length);
  return `<div class="nav-title">Categorias</div>` + groups.map(g =>
    `<button class="nav-item" data-nav-target="${sectionId(kind, g.section)}">${esc(g.section)}</button>`
  ).join('');
}

const contentEl = document.getElementById('content');
const navEl = document.getElementById('nav');
const contentCache = {};
const navCache = {};

function mountTab(kind){
  if(!contentCache[kind]) contentCache[kind] = renderTab(kind);
  if(!navCache[kind]) navCache[kind] = renderNav(kind);
  contentEl.innerHTML = contentCache[kind];
  navEl.innerHTML = navCache[kind];
  attachNavListeners();
  refreshAllModifiedUI(kind);
  updateChangesPill();
  regenerateOutput();
  applySearch();
}

function attachNavListeners(){
  navEl.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = document.getElementById(btn.dataset.navTarget);
      if(target) target.scrollIntoView({ behavior:'smooth', block:'start' });
    });
  });
}

function setState(kind, id, value){
  state[kind][id] = value;
  updateFieldModifiedUI(kind, id);
  updateChangesPill();
  regenerateOutput();
}

function updateFieldModifiedUI(kind, id){
  const modified = state[kind][id] !== original[kind][id];
  const row = contentEl.querySelector(`.field[data-field-id="${cssEscape(id)}"]`);
  const badge = contentEl.querySelector(`[data-badge-for="${cssEscape(id)}"]`);
  const resetBtn = contentEl.querySelector(`[data-reset-for="${cssEscape(id)}"]`);
  if(row) row.classList.toggle('modified', modified);
  if(badge) badge.hidden = !modified;
  if(resetBtn) resetBtn.hidden = !modified;
}

function cssEscape(s){
  return String(s).replace(/[."\[\]]/g, '\\$&');
}

function refreshAllModifiedUI(kind){
  Object.keys(state[kind]).forEach(id => updateFieldModifiedUI(kind, id));
}

function updateChangesPill(){
  const count = Object.keys(state[activeTab]).filter(id => state[activeTab][id] !== original[activeTab][id]).length;
  const pill = document.getElementById('changes-pill');
  const resetBtn = document.getElementById('reset-btn');
  if(count > 0){
    pill.hidden = false;
    pill.textContent = count + (count===1 ? ' alteração pendente' : ' alterações pendentes');
    resetBtn.hidden = false;
  } else {
    pill.hidden = true;
    resetBtn.hidden = true;
  }
}

// Event delegation: attached once to the container, survives every re-render
// (mountTab / resetSingleField replace innerHTML, so per-element listeners
// would otherwise pile up as duplicates every time a field is reset).
function initDelegatedListeners(){
  contentEl.addEventListener('change', e => {
    const el = e.target;
    if(el.classList.contains('ctl-toggle')){
      const v = el.checked ? 'true' : 'false';
      const stateEl = contentEl.querySelector(`[data-state-for="${cssEscape(el.dataset.id)}"]`);
      if(stateEl) stateEl.textContent = el.checked ? 'Ativado' : 'Desativado';
      setState(el.dataset.kind, el.dataset.id, v);
    } else if(el.classList.contains('ctl-select')){
      setState(el.dataset.kind, el.dataset.id, el.value);
    }
  });
  contentEl.addEventListener('input', e => {
    const el = e.target;
    if(el.classList.contains('ctl-range')){
      const numEl = contentEl.querySelector(`.ctl-range-num[data-id="${cssEscape(el.dataset.id)}"]`);
      if(numEl) numEl.value = el.value;
      setState(el.dataset.kind, el.dataset.id, el.value);
    } else if(el.classList.contains('ctl-range-num')){
      const rangeEl = contentEl.querySelector(`.ctl-range[data-id="${cssEscape(el.dataset.id)}"]`);
      if(rangeEl) rangeEl.value = el.value;
      setState(el.dataset.kind, el.dataset.id, el.value);
    } else if(el.classList.contains('ctl-text')){
      setState(el.dataset.kind, el.dataset.id, el.value);
    }
  });
  contentEl.addEventListener('click', e => {
    const pwBtn = e.target.closest('[data-pw-toggle]');
    if(pwBtn){
      const id = pwBtn.dataset.pwToggle;
      const input = contentEl.querySelector(`input.ctl-text[data-id="${cssEscape(id)}"]`);
      if(input){
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        pwBtn.textContent = show ? 'ocultar' : 'mostrar';
      }
      return;
    }
    const resetBtn = e.target.closest('[data-reset-for]');
    if(resetBtn){
      resetSingleField(activeTab, resetBtn.dataset.resetFor);
    }
  });
}

function resetSingleField(kind, id){
  const f = fieldById[id];
  state[kind][id] = original[kind][id];
  const row = contentEl.querySelector(`.field[data-field-id="${cssEscape(id)}"]`);
  if(row){
    const controlWrap = row.querySelector('.field-control');
    controlWrap.innerHTML = controlHTML(kind, f);
  }
  updateFieldModifiedUI(kind, id);
  updateChangesPill();
  regenerateOutput();
}

function resetAll(){
  Object.keys(state[activeTab]).forEach(id => { state[activeTab][id] = original[activeTab][id]; });
  contentCache[activeTab] = null;
  mountTab(activeTab);
}

function generateOutput(kind){
  let text = kind === 'ini' ? BUNDLE.iniTemplate : BUNDLE.luaTemplate;
  const fields = kind === 'ini' ? BUNDLE.iniFields : BUNDLE.luaFields;
  fields.forEach(f => {
    let v = state[kind][f.id];
    if(f.sensitive && String(v).trim() === ''){
      v = '<<DEFINA_A_SENHA_AQUI>>';
    } else if(f.type === 'range'){
      v = fmtNum(v, f.decimals || 0);
    } else if(f.type === 'text' && kind === 'lua'){
      v = String(v).replace(/\\/g,'\\\\').replace(/"/g,'\\"');
    } else if(f.type === 'text' && kind === 'ini'){
      v = String(v).replace(/[\r\n]+/g, ' ');
    }
    text = text.split(f.ph).join(v);
  });
  return text;
}

function regenerateOutput(){
  const code = document.getElementById('output-code');
  code.value = generateOutput(activeTab);
  document.getElementById('output-title').textContent = (activeTab === 'ini' ? 'Duo.ini' : 'Duo_SandboxVars.lua') + ' gerado';
}

function applySearch(){
  const q = normalize(document.getElementById('search').value.trim());
  const sections = contentEl.querySelectorAll('.section');
  let anyVisible = false;
  sections.forEach(sec => {
    const rows = sec.querySelectorAll('.field');
    let visibleInSection = 0;
    rows.forEach(row => {
      const match = q === '' || row.dataset.search.includes(q);
      row.hidden = !match;
      if(match) visibleInSection++;
    });
    sec.hidden = visibleInSection === 0;
    if(visibleInSection > 0) anyVisible = true;
  });
  const noResults = document.getElementById('no-results-' + activeTab);
  if(noResults) noResults.hidden = anyVisible || q === '';
}

document.getElementById('search').addEventListener('input', applySearch);

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeTab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.setAttribute('aria-selected', b === btn ? 'true' : 'false'));
    document.getElementById('search').value = '';
    mountTab(activeTab);
    contentEl.scrollTop = 0;
  });
});

document.getElementById('reset-btn').addEventListener('click', resetAll);

document.getElementById('copy-btn').addEventListener('click', async () => {
  const text = generateOutput(activeTab);
  const feedback = document.getElementById('copy-feedback');
  try{
    await navigator.clipboard.writeText(text);
    feedback.textContent = 'Copiado! Já pode colar no servidor.';
  }catch(e){
    const ta = document.getElementById('output-code');
    ta.focus();
    ta.select();
    feedback.textContent = 'Não deu pra copiar automaticamente — texto selecionado, use Ctrl+C.';
  }
  setTimeout(() => { feedback.textContent = ''; }, 4000);
});

initDelegatedListeners();
mountTab('ini');
</script>
